<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Equity Research - Small Cap India</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
        .container{max-width:1400px;margin:0 auto;padding:1rem}
        nav{background:#1e293b;border-bottom:1px solid #334155;padding:.75rem 1rem;position:sticky;top:0;z-index:10}
        nav .inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
        .logo{font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .btn{padding:.45rem .9rem;border-radius:8px;cursor:pointer;border:none;font-weight:500;font-size:.8rem;transition:all .15s}
        .btn-primary{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}
        .btn-secondary{background:#334155;color:#e2e8f0}
        .btn-secondary:hover{background:#475569}
        .card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:1.25rem;margin-bottom:.75rem}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem}
        .stat-card .label{color:#94a3b8;font-size:.75rem}
        .stat-card .value{font-size:1.75rem;font-weight:700;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
        .chip{padding:.35rem .75rem;border-radius:9999px;cursor:pointer;background:#1e293b;border:1px solid #334155;color:#94a3b8;font-size:.75rem;transition:all .15s}
        .chip:hover{border-color:#60a5fa;color:#fff}
        .chip.active{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;border-color:transparent}
        input[type=text]{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:.5rem .75rem;color:#e2e8f0;font-size:.85rem;width:300px}
        input:focus{outline:none;border-color:#3b82f6}
        table{width:100%;border-collapse:collapse}
        th{text-align:left;padding:.6rem .5rem;color:#94a3b8;font-weight:500;font-size:.8rem;border-bottom:2px solid #334155}
        td{padding:.6rem .5rem;border-bottom:1px solid #1e293b;font-size:.8rem}
        tr{cursor:pointer;transition:background .1s}
        tr:hover{background:#1e293b}
        .tag{display:inline-block;padding:.15rem .45rem;border-radius:4px;font-size:.65rem;font-weight:600;margin-right:.15rem}
        .tag-g{background:#4c1d95;color:#c4b5fd}
        .tag-o{background:#78350f;color:#fbbf24}
        .tag-c{background:#164e63;color:#67e8f9}
        .tag-d{background:#713f12;color:#fde68a}
        .tag-f{background:#065f46;color:#6ee7b7}
        .sector-badge{font-size:.65rem;padding:.15rem .4rem;border-radius:4px;background:#1e3a5f;color:#60a5fa}
        .muted{color:#94a3b8}
        .detail-header{display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:1rem}
        .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem;margin:1rem 0}
        .insight-bar{display:flex;align-items:center;margin-bottom:.4rem}
        .insight-bar .bar{flex:1;margin:0 .5rem;background:#334155;border-radius:9999px;height:5px}
        .insight-bar .fill{background:#8b5cf6;height:5px;border-radius:9999px}
        .back-btn{margin-bottom:1rem}
        .empty{text-align:center;padding:3rem;color:#64748b}
        .search-row{display:flex;gap:.5rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
        .pagination{display:flex;justify-content:center;align-items:center;gap:.75rem;margin-top:1rem}
        .pagination span{color:#94a3b8;font-size:.8rem}
        .filter-row{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:1rem;padding:1rem;background:#1e293b;border-radius:12px;border:1px solid #334155}
        .filter-group{display:flex;flex-direction:column;gap:.35rem}
        .filter-label{font-size:.7rem;color:#94a3b8;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
        .sort-select{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:.4rem .6rem;color:#e2e8f0;font-size:.8rem;min-width:140px}
        .sort-select:focus{outline:none;border-color:#3b82f6}
        .sort-btn{min-width:70px;font-size:.75rem}
        .date-input{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:.4rem .6rem;color:#e2e8f0;font-size:.8rem;width:130px}
        .date-input:focus{outline:none;border-color:#3b82f6}
        .amount-input{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:.4rem .6rem;color:#e2e8f0;font-size:.8rem;width:80px}
        .amount-input:focus{outline:none;border-color:#3b82f6}
        .compare-table th,.compare-table td{white-space:nowrap}
        .compare-table tr:hover td{background:#1e293b}
        .ann-item{padding:.6rem 0;border-bottom:1px solid #334155}
        .ann-item:last-child{border-bottom:none}
    </style>
</head>
<body>
    <nav>
        <div class="inner">
            <div class="logo">AI Equity Research - Small Cap India</div>
            <div id="nav-buttons"></div>
        </div>
    </nav>
    <div class="container" id="app"></div>

<script>
var API = '/api';
var state = { page: 'dashboard', sector: null, companyId: null, search: '', offset: 0, insight_type: null, sort_by: 'market_cap', sort_order: 'desc', from_date: null, to_date: null, sentiment: null, min_amount: null, max_amount: null, corporate_actions: null };

function restoreState() {
    var params = new URLSearchParams(window.location.search);
    var company = params.get('company');
    var page = params.get('page');
    state.page = page || (company ? 'company' : 'dashboard');
    if (company) state.companyId = parseInt(company) || null;
    if (params.get('sector')) state.sector = params.get('sector');
    if (params.get('search')) state.search = params.get('search');
    if (params.get('offset')) state.offset = parseInt(params.get('offset')) || 0;
    if (params.get('insight_type')) state.insight_type = params.get('insight_type');
    if (params.get('sort_by')) state.sort_by = params.get('sort_by');
    if (params.get('sort_order')) state.sort_order = params.get('sort_order');
    if (params.get('from_date')) state.from_date = params.get('from_date');
    if (params.get('to_date')) state.to_date = params.get('to_date');
    if (params.get('sentiment')) state.sentiment = params.get('sentiment');
    var mn = params.get('min_amount'); if (mn !== null && mn !== '') state.min_amount = parseFloat(mn);
    var mx = params.get('max_amount'); if (mx !== null && mx !== '') state.max_amount = parseFloat(mx);
    if (params.get('corporate_actions')) state.corporate_actions = parseInt(params.get('corporate_actions')) || null;
}

function syncUrl() {
    var params = new URLSearchParams();
    if (state.page && state.page !== 'dashboard') params.set('page', state.page);
    if (state.companyId) params.set('company', state.companyId);
    if (state.sector) params.set('sector', state.sector);
    if (state.search) params.set('search', state.search);
    if (state.offset) params.set('offset', state.offset);
    if (state.insight_type) params.set('insight_type', state.insight_type);
    if (state.sort_by && state.sort_by !== 'market_cap') params.set('sort_by', state.sort_by);
    if (state.sort_order && state.sort_order !== 'desc') params.set('sort_order', state.sort_order);
    if (state.from_date) params.set('from_date', state.from_date);
    if (state.to_date) params.set('to_date', state.to_date);
    if (state.sentiment) params.set('sentiment', state.sentiment);
    if (state.min_amount !== null && state.min_amount !== undefined && state.min_amount !== '') params.set('min_amount', state.min_amount);
    if (state.max_amount !== null && state.max_amount !== undefined && state.max_amount !== '') params.set('max_amount', state.max_amount);
    if (state.corporate_actions) params.set('corporate_actions', state.corporate_actions);
    var qs = params.toString();
    var url = qs ? '/?' + qs : '/';
    var cur = window.location.pathname + window.location.search;
    if (cur === url) return;
    history.pushState(state, '', url);
}

(function() {
    restoreState();
})();
window.addEventListener('popstate', function() {
    restoreState();
    renderNav();
    render();
});

function api(path, opts) {
    var fetchOpts = {method: (opts && opts.method) || 'GET'};
    if (opts && opts.body) {
        fetchOpts.headers = {'Content-Type': 'application/json'};
        fetchOpts.body = JSON.stringify(opts.body);
    }
    return fetch(API + path, fetchOpts).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
    });
}

function navigate(page, opts) {
    state.page = page;
    if (opts) {
        if (opts.sector !== undefined) state.sector = opts.sector;
        if (opts.companyId !== undefined) state.companyId = opts.companyId;
        if (opts.offset !== undefined) state.offset = opts.offset;
    }
    renderNav();
    render();
}

function renderNav() {
    var pages = ['dashboard', 'companies'];
    var html = '';
    for (var i = 0; i < pages.length; i++) {
        var p = pages[i];
        var cls = state.page === p ? 'btn btn-primary' : 'btn btn-secondary';
        html += '<button class="' + cls + '" onclick="navigate(\'' + p + '\')" style="margin-left:.5rem">' + p.charAt(0).toUpperCase() + p.slice(1) + '</button>';
    }
    html += '<a href="/fetch" class="btn btn-secondary" style="margin-left:.5rem;text-decoration:none">Fetch Stock</a>';
    document.getElementById('nav-buttons').innerHTML = html;
}

function render() {
    var app = document.getElementById('app');
    if (state.page === 'dashboard') renderDashboard(app);
    else if (state.page === 'companies') renderCompanies(app);
    else if (state.page === 'company') renderCompany(app);
    syncUrl();
}

function renderDashboard(el) {
    el.innerHTML = '<div class="empty">Loading...</div>';
    api('/stats').then(function(d) {
        var html = '<div class="stats-grid">';
        html += '<div class="card stat-card"><div class="label">Companies</div><div class="value">' + d.total_companies + '</div></div>';
        html += '<div class="card stat-card"><div class="label">Announcements</div><div class="value">' + d.total_announcements.toLocaleString() + '</div></div>';
        html += '<div class="card stat-card"><div class="label">Insights</div><div class="value">' + d.total_insights.toLocaleString() + '</div></div>';
        html += '<div class="card stat-card"><div class="label">Active Companies</div><div class="value">' + d.companies_with_announcements + '</div></div>';
        html += '</div>';

        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">';
        html += '<div class="card"><h3 style="margin-bottom:.75rem;font-size:.9rem">By Exchange</h3>';
        var ex = d.by_exchange || {};
        for (var k in ex) {
            html += '<div class="insight-bar"><span style="width:60px;font-size:.75rem;text-transform:uppercase">' + k + '</span>';
            html += '<div class="bar"><div class="fill" style="width:' + (ex[k] / d.total_announcements * 100) + '%"></div></div>';
            html += '<span style="font-size:.7rem" class="muted">' + ex[k].toLocaleString() + '</span></div>';
        }
        html += '</div>';

        html += '<div class="card"><h3 style="margin-bottom:.75rem;font-size:.9rem">Insight Types</h3>';
        var it = d.by_insight_type || {};
        for (var k in it) {
            if (k === 'general') continue;
            html += '<div class="insight-bar" style="cursor:pointer" onclick="navigate(\'companies\',{sector:null,search:\'\'});setTimeout(function(){filterByInsight(\'' + k + '\')},100)">';
            html += '<span style="width:100px;font-size:.7rem;text-transform:capitalize">' + k.replace(/_/g, ' ') + '</span>';
            html += '<div class="bar"><div class="fill" style="width:' + (it[k] / d.total_insights * 100) + '%"></div></div>';
            html += '<span style="font-size:.7rem" class="muted">' + it[k].toLocaleString() + '</span></div>';
        }
        html += '</div></div>';

        html += '<div style="text-align:center;margin-top:1.5rem"><button class="btn btn-primary" onclick="navigate(\'companies\')" style="padding:.6rem 2rem;font-size:.95rem">Browse Companies</button></div>';

        el.innerHTML = html;
    }).catch(function(e) {
        el.innerHTML = '<div class="card">Error loading dashboard: ' + e.message + '</div>';
    });
}

function filterByInsight(type) {
    state.insight_type = type;
    state.offset = 0;
    renderCompanies(document.getElementById('app'));
}

function renderCompanies(el) {
    el.innerHTML = '<div class="empty">Loading...</div>';

    var url = '/companies?limit=100&offset=' + state.offset;
    if (state.sector) url += '&sector=' + encodeURIComponent(state.sector);
    if (state.search) url += '&search=' + encodeURIComponent(state.search);
    if (state.insight_type) url += '&insight_type=' + encodeURIComponent(state.insight_type);
    if (state.sort_by) url += '&sort_by=' + encodeURIComponent(state.sort_by);
    if (state.sort_order) url += '&sort_order=' + encodeURIComponent(state.sort_order);
    if (state.from_date) url += '&from_date=' + encodeURIComponent(state.from_date);
    if (state.to_date) url += '&to_date=' + encodeURIComponent(state.to_date);
    if (state.sentiment) url += '&sentiment=' + encodeURIComponent(state.sentiment);
    if (state.min_amount) url += '&min_amount=' + state.min_amount;
    if (state.max_amount) url += '&max_amount=' + state.max_amount;

    Promise.all([api('/sectors'), api(url)]).then(function(results) {
        var sectors = results[0].sectors || {};
        var data = results[1];
        var companies = data.companies;
        var total = data.total;

        var html = '';

        html += '<div class="search-row">';
        html += '<input type="text" id="search-box" placeholder="Search company or symbol..." value="' + (state.search || '') + '" onkeyup="if(event.key===\'Enter\'){state.search=this.value;state.offset=0;renderCompanies(document.getElementById(\'app\'))}">';
        html += '<button class="btn btn-secondary" onclick="state.search=document.getElementById(\'search-box\').value;state.offset=0;renderCompanies(document.getElementById(\'app\'))">Search</button>';
        html += '<span class="muted" style="margin-left:auto">' + total.toLocaleString() + ' companies</span>';
        html += '</div>';

        html += '<div class="filters">';
        html += '<span class="chip' + (!state.sector ? ' active' : '') + '" onclick="state.sector=null;state.offset=0;renderCompanies(document.getElementById(\'app\'))">All</span>';
        for (var s in sectors) {
            html += '<span class="chip' + (state.sector === s ? ' active' : '') + '" onclick="state.sector=\'' + s + '\';state.offset=0;renderCompanies(document.getElementById(\'app\'))">' + s.replace(/_/g, ' ') + ' (' + sectors[s] + ')</span>';
        }
        html += '</div>';

        html += '<div class="filter-row">';
        html += '<div class="filter-group">';
        html += '<label class="filter-label">Insight Type</label>';
        html += '<div class="filters">';
        var insightTypes = [{v:'',l:'All'},{v:'guidance',l:'Guidance'},{v:'order',l:'Orders'},{v:'capex',l:'Capex'},{v:'financial',l:'Financial'},{v:'dividend',l:'Dividend'},{v:'credit_rating',l:'Credit'},{v:'management',l:'Management'},{v:'acquisition',l:'Acquisition'}];
        for (var i=0;i<insightTypes.length;i++) {
            var it=insightTypes[i];
            html += '<span class="chip'+(state.insight_type===it.v||(!state.insight_type&&!it.v)?' active':'')+'" onclick="state.insight_type=\''+it.v+'\';state.offset=0;renderCompanies(document.getElementById(\'app\'))">'+it.l+'</span>';
        }
        html += '</div></div>';

        html += '<div class="filter-group">';
        html += '<label class="filter-label">Sort By</label>';
        html += '<select class="sort-select" onchange="state.sort_by=this.value;state.offset=0;renderCompanies(document.getElementById(\'app\'))">';
        var sortOpts = [{v:'market_cap',l:'Market Cap'},{v:'announcements',l:'Announcements'},{v:'company',l:'Company Name'},{v:'latest',l:'Latest Date'},{v:'ca_latest',l:'Latest Corp. Action'},{v:'sentiment',l:'Sentiment'},{v:'guidance_count',l:'Guidance Count'},{v:'order_count',l:'Order Count'},{v:'capex_count',l:'Capex Count'}];
        for (var i=0;i<sortOpts.length;i++) {
            html += '<option value="'+sortOpts[i].v+'"'+(state.sort_by===sortOpts[i].v?' selected':'')+'>'+sortOpts[i].l+'</option>';
        }
        html += '</select>';
        html += '<button class="btn btn-secondary sort-btn" onclick="state.sort_order=state.sort_order===\'desc\'?\'asc\':\'desc\';renderCompanies(document.getElementById(\'app\'))">'+(state.sort_order==='desc'?'↓ Desc':'↑ Asc')+'</button>';
        html += '</div>';

        html += '<div class="filter-group">';
        html += '<label class="filter-label">Date Range</label>';
        html += '<input type="date" class="date-input" value="'+(state.from_date||'')+'" onchange="state.from_date=this.value||null;state.offset=0;renderCompanies(document.getElementById(\'app\'))">';
        html += '<span class="muted" style="font-size:.7rem">to</span>';
        html += '<input type="date" class="date-input" value="'+(state.to_date||'')+'" onchange="state.to_date=this.value||null;state.offset=0;renderCompanies(document.getElementById(\'app\'))">';
        html += '</div>';

        html += '<div class="filter-group">';
        html += '<label class="filter-label">Sentiment</label>';
        html += '<div class="filters">';
        var sentOpts = [{v:'',l:'All'},{v:'positive',l:'Positive'},{v:'negative',l:'Negative'},{v:'neutral',l:'Neutral'}];
        for (var i=0;i<sentOpts.length;i++) {
            html += '<span class="chip'+(state.sentiment===sentOpts[i].v||(!state.sentiment&&!sentOpts[i].v)?' active':'')+'" onclick="state.sentiment=\''+sentOpts[i].v+'\';state.offset=0;renderCompanies(document.getElementById(\'app\'))">'+sentOpts[i].l+'</span>';
        }
        html += '</div></div>';

        html += '<div class="filter-group">';
        html += '<label class="filter-label">Amount (Cr)</label>';
        html += '<input type="number" class="amount-input" placeholder="Min" value="'+(state.min_amount||'')+'" onchange="state.min_amount=this.value||null;state.offset=0;renderCompanies(document.getElementById(\'app\'))">';
        html += '<span class="muted" style="font-size:.7rem">to</span>';
        html += '<input type="number" class="amount-input" placeholder="Max" value="'+(state.max_amount||'')+'" onchange="state.max_amount=this.value||null;state.offset=0;renderCompanies(document.getElementById(\'app\'))">';
        html += '</div>';

        html += '<div class="filter-group">';
        html += '<label class="filter-label">Corporate Actions</label>';
        html += '<div class="filters">';
        html += '<span class="chip'+(!state.corporate_actions?' active':'')+'" onclick="state.corporate_actions=null;state.offset=0;renderCompanies(document.getElementById(\'app\'))">All</span>';
        html += '<span class="chip'+(state.corporate_actions?' active':'')+'" onclick="state.corporate_actions=1;state.offset=0;renderCompanies(document.getElementById(\'app\'))">Has Actions</span>';
        html += '</div></div>';

        html += '<div class="filter-group" style="align-self:end">';
        html += '<button class="btn btn-secondary" onclick="state.insight_type=null;state.sort_by=\'market_cap\';state.sort_order=\'desc\';state.from_date=null;state.to_date=null;state.sentiment=null;state.min_amount=null;state.max_amount=null;state.corporate_actions=null;state.offset=0;renderCompanies(document.getElementById(\'app\'))">Clear Filters</button>';
        html += '</div>';
        html += '</div>';

        html += '<div class="card" style="padding:.5rem;overflow-x:auto"><table><thead><tr>';
        html += '<th>Company</th><th>MCap</th><th>Sector</th><th>Exch</th><th>Anns</th><th>Insights</th><th>Latest</th>';
        html += '</tr></thead><tbody>';

        for (var i = 0; i < companies.length; i++) {
            var c = companies[i];
            var sym = c.nse_symbol || c.bse_code || '';
            var exch = '';
            if (c.nse_symbol && c.bse_code) exch = 'NSE/BSE';
            else if (c.nse_symbol) exch = 'NSE';
            else if (c.bse_code) exch = 'BSE';

            html += '<tr onclick="navigate(\'company\',{companyId:' + c.id + '})">';
            html += '<td><a href="/?company=' + c.id + '" onclick="event.stopPropagation();if(event.ctrlKey||event.metaKey||event.shiftKey||event.button!==0){return true;}navigate(\'company\',{companyId:' + c.id + '});return false;" style="text-decoration:none;color:inherit;cursor:pointer"><div style="font-weight:600">' + (c.company_name || '') + '</div><div class="muted" style="font-size:.7rem">' + sym + ' <span style="font-size:.65rem;color:#60a5fa" title="Open in new tab">↗</span>';
            if (c.ca_count) html += ' <span style="font-size:.6rem;background:#a78bfa22;color:#a78bfa;border:1px solid #a78bfa55;border-radius:9999px;padding:.05rem .4rem" title="Corporate actions">' + c.ca_count + ' CA</span>';
            html += '</div></a></td>';
            html += '<td>₹' + (c.market_cap_cr ? c.market_cap_cr.toFixed(0) : '-') + ' Cr</td>';
            html += '<td><span class="sector-badge">' + (c.sector || 'other').replace(/_/g, ' ') + '</span></td>';
            html += '<td>' + exch + '</td>';
            html += '<td>' + (c.total_announcements || 0) + '</td>';
            html += '<td>';
            if (c.has_guidance) html += '<span class="tag tag-g">G</span>';
            if (c.has_orders) html += '<span class="tag tag-o">O</span>';
            if (c.has_capex) html += '<span class="tag tag-c">C</span>';
            if (c.has_dividend) html += '<span class="tag tag-d">D</span>';
            if (c.has_financials) html += '<span class="tag tag-f">F</span>';
            html += '</td>';
            html += '<td class="muted">' + (c.latest_announcement || '-') + '</td>';
            html += '</tr>';
        }

        html += '</tbody></table></div>';

        if (total > 100) {
            html += '<div class="pagination">';
            html += '<button class="btn btn-secondary" onclick="state.offset=Math.max(0,state.offset-100);renderCompanies(document.getElementById(\'app\'))"' + (state.offset <= 0 ? ' disabled' : '') + '>Prev</button>';
            html += '<span>Page ' + (Math.floor(state.offset / 100) + 1) + ' of ' + Math.ceil(total / 100) + '</span>';
            html += '<button class="btn btn-secondary" onclick="state.offset=state.offset+100;renderCompanies(document.getElementById(\'app\'))"' + (state.offset + 100 >= total ? ' disabled' : '') + '>Next</button>';
            html += '</div>';
        }

        el.innerHTML = html;
        syncUrl();
    }).catch(function(e) {
        el.innerHTML = '<div class="card">Error: ' + e.message + '</div>';
    });
}

function renderCompany(el) {
    el.innerHTML = '<div class="empty">Loading...</div>';

    api('/companies/' + state.companyId).then(function(d) {
        var c = d.company;
        var ins = d.insight_summary || [];

function loadStockInfo(symbol) {
    var card = document.getElementById('stock-info-card');
    if (!card) return;

    api('/stock-info/' + encodeURIComponent(symbol)).then(function(d) {
        if (!d.info || d.error) {
            card.innerHTML = '<div style="font-size:.8rem;color:#94a3b8">Live data unavailable for ' + symbol + '</div>';
            return;
        }

        var info = d.info;
        var price = info.current_price || info.previous_close || 0;
        var prevClose = info.previous_close || 0;
        var change = prevClose ? ((price - prevClose) / prevClose * 100) : 0;
        var changeColor = change >= 0 ? '#34d399' : '#f87171';
        var changeSign = change >= 0 ? '+' : '';

        var html = '<div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:1rem">';
        html += '<div>';
        html += '<div style="font-size:.7rem;color:#94a3b8;margin-bottom:.25rem">LIVE MARKET DATA</div>';
        html += '<div style="font-size:2rem;font-weight:700;color:#e2e8f0">₹' + price.toFixed(2) + '</div>';
        if (prevClose) {
            html += '<div style="font-size:.85rem;font-weight:600;color:' + changeColor + '">' + changeSign + change.toFixed(2) + '% from ₹' + prevClose.toFixed(2) + '</div>';
        }
        html += '</div>';

        html += '<div style="display:flex;gap:1.5rem;flex-wrap:wrap">';
        if (info.day_high && info.day_low) {
            html += '<div><div class="muted" style="font-size:.65rem">Day Range</div><div style="font-size:.85rem;font-weight:500">₹' + info.day_low.toFixed(2) + ' - ₹' + info.day_high.toFixed(2) + '</div></div>';
        }
        if (info["52w_high"] && info["52w_low"]) {
            html += '<div><div class="muted" style="font-size:.65rem">52 Week Range</div><div style="font-size:.85rem;font-weight:500">₹' + info["52w_low"].toFixed(2) + ' - ₹' + info["52w_high"].toFixed(2) + '</div></div>';
        }
        if (info.volume) {
            html += '<div><div class="muted" style="font-size:.65rem">Volume</div><div style="font-size:.85rem;font-weight:500">' + (info.volume / 100000).toFixed(1) + 'L</div></div>';
        }
        html += '</div>';
        html += '</div>';

        html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.75rem;margin-top:1rem;padding-top:1rem;border-top:1px solid #334155">';

        var metrics = [
            { label: 'Market Cap', value: info.market_cap ? '₹' + (info.market_cap / 10000000).toFixed(0) + ' Cr' : '-' },
            { label: 'P/E Ratio', value: info.pe_ratio ? info.pe_ratio.toFixed(2) : '-' },
            { label: 'P/B Ratio', value: info.pb_ratio ? info.pb_ratio.toFixed(2) : '-' },
            { label: 'EPS', value: info.eps ? '₹' + info.eps.toFixed(2) : '-' },
            { label: 'ROE', value: info.roe ? (info.roe * 100).toFixed(1) + '%' : '-' },
            { label: 'Debt/Equity', value: info.debt_to_equity ? info.debt_to_equity.toFixed(2) : '-' },
            { label: 'Div Yield', value: info.dividend_yield ? (info.dividend_yield * 100).toFixed(2) + '%' : '-' },
            { label: 'Beta', value: info.beta ? info.beta.toFixed(2) : '-' },
            { label: 'SMA 50', value: info.sma_50 ? '₹' + info.sma_50.toFixed(2) : '-' },
            { label: 'SMA 200', value: info.sma_200 ? '₹' + info.sma_200.toFixed(2) : '-' },
        ];

        for (var i = 0; i < metrics.length; i++) {
            var m = metrics[i];
            html += '<div style="background:#0f172a;border-radius:6px;padding:.5rem .75rem">';
            html += '<div class="muted" style="font-size:.6rem">' + m.label + '</div>';
            html += '<div style="font-size:.85rem;font-weight:600">' + m.value + '</div>';
            html += '</div>';
        }

        html += '</div>';

        card.innerHTML = html;
    }).catch(function(e) {
        card.innerHTML = '<div style="font-size:.8rem;color:#94a3b8">Could not load market data</div>';
    });
}

function loadSentimentTimeline(companyId) {
    var el = document.getElementById('sentiment-timeline-content');
    if (!el) return;

    api('/sentiment-timeline/' + companyId).then(function(d) {
        var timeline = d.timeline || [];
        if (timeline.length === 0) {
            el.innerHTML = '<div class="muted" style="font-size:.75rem">No sentiment data available</div>';
            return;
        }

        var maxVal = 0;
        for (var i = 0; i < timeline.length; i++) {
            var t = timeline[i];
            var total = t.positive + t.negative + t.neutral;
            if (total > maxVal) maxVal = total;
        }

        var html = '<div style="display:flex;gap:.5rem;align-items:end;overflow-x:auto;padding:.5rem 0">';
        for (var i = 0; i < timeline.length; i++) {
            var t = timeline[i];
            var total = t.positive + t.negative + t.neutral;
            var h = maxVal > 0 ? (total / maxVal * 80) : 0;
            var pH = total > 0 ? (t.positive / total * h) : 0;
            var nH = total > 0 ? (t.neutral / total * h) : 0;
            var ngH = total > 0 ? (t.negative / total * h) : 0;

            var label = t.month.substring(2);

            html += '<div style="text-align:center;min-width:35px">';
            html += '<div style="display:flex;flex-direction:column-reverse;height:85px;width:24px;margin:0 auto;border-radius:4px;overflow:hidden;background:#1e293b">';
            html += '<div style="height:' + pH + 'px;background:#34d399" title="Positive: ' + t.positive + '"></div>';
            html += '<div style="height:' + nH + 'px;background:#60a5fa" title="Neutral: ' + t.neutral + '"></div>';
            html += '<div style="height:' + ngH + 'px;background:#f87171" title="Negative: ' + t.negative + '"></div>';
            html += '</div>';
            html += '<div style="font-size:.55rem;color:#64748b;margin-top:.25rem;transform:rotate(-45deg);white-space:nowrap">' + label + '</div>';
            html += '</div>';
        }
        html += '</div>';

        html += '<div style="display:flex;gap:1rem;font-size:.7rem;margin-top:.5rem;justify-content:center">';
        html += '<span style="color:#34d399">● Positive</span>';
        html += '<span style="color:#60a5fa">● Neutral</span>';
        html += '<span style="color:#f87171">● Negative</span>';
        html += '</div>';

        el.innerHTML = html;
    }).catch(function(e) {
        el.innerHTML = '<div class="muted" style="font-size:.75rem">Could not load timeline</div>';
    });
}

function renderAnnouncement(a) {

    html += '<div class="muted" style="font-size:.7rem;margin-top:.15rem">' + (a.exchange || '') + ' | ' + (a.category || '') + '</div>';

    if (a.ai_summary) {
        var s = typeof a.ai_summary === 'string' ? JSON.parse(a.ai_summary) : a.ai_summary;
        var sentColor = s.sentiment === 'positive' ? '#34d399' : s.sentiment === 'negative' ? '#f87171' : '#60a5fa';
        var sentLabel = s.sentiment || 'neutral';
        var impColor = s.importance === 'high' ? '#fbbf24' : s.importance === 'low' ? '#64748b' : '#94a3b8';

        html += '<div style="margin-top:.35rem;padding:.5rem;background:#0f172a;border-radius:6px;border-left:3px solid #8b5cf6;font-size:.75rem;color:#c4b5fd;line-height:1.5">';
        html += '<div style="display:flex;gap:.5rem;margin-bottom:.3rem;flex-wrap:wrap">';
        html += '<span style="color:' + sentColor + ';font-weight:600;font-size:.65rem">' + sentLabel.toUpperCase() + '</span>';
        html += '<span style="color:' + impColor + ';font-size:.65rem">[' + (s.importance || 'medium').toUpperCase() + ']</span>';
        if (s.categories) {
            for (var j = 0; j < s.categories.length; j++) {
                html += '<span class="sector-badge">' + s.categories[j] + '</span>';
            }
        }
        html += '</div>';
        html += '<div>' + (s.summary || '') + '</div>';
        if (s.key_numbers && s.key_numbers.length) {
            html += '<div style="margin-top:.3rem;color:#94a3b8;font-size:.7rem">Key numbers: ' + s.key_numbers.join('; ') + '</div>';
        }
        html += '</div>';
    } else if (a.description) {
        html += '<div style="font-size:.7rem;color:#64748b;margin-top:.15rem">' + a.description.substring(0, 200) + (a.description.length > 200 ? '...' : '') + '</div>';
        html += '<button class="btn btn-secondary" style="margin-top:.3rem;font-size:.7rem;padding:.2rem .5rem" onclick="generateAnnSummary(' + a.id + ', ' + a.company_id + ')">Analyze with AI</button>';
    }
    html += '</div>';
    return html;
}

        'FUTURE OUTLOOK': '#34d399',
        'KEY RED FLAGS': '#f87171',
        'POSITIVE SIGNALS': '#fbbf24',
        'COMPANY DESCRIPTION': '#a78bfa'
    };

    var lines = text.split('\n');
    var currentSection = '';
    for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.indexOf('## ') === 0) {
            currentSection = line.replace('## ', '').trim();
            var col = sectionColors[currentSection] || '#60a5fa';
            html += '<div style="font-weight:700;font-size:.85rem;margin-top:.75rem;margin-bottom:.35rem;color:' + col + ';border-bottom:1px solid ' + col + '33;padding-bottom:.25rem;display:flex;align-items:center;gap:.4rem">';
            html += '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + col + '"></span>';
            html += currentSection;
            html += '</div>';
        } else if (line.indexOf('[') === 0 && line.indexOf(']') > 0) {
            var dateMatch = line.match(/\[([^\]]+)\]/);
            var dateStr = dateMatch ? dateMatch[1] : '';
            var rest = dateMatch ? line.substring(line.indexOf(']') + 1).trim() : line;
            html += '<div style="margin-bottom:.25rem;font-size:.78rem;line-height:1.5">';
            if (dateStr) html += '<span style="color:#fbbf24;font-weight:600">[' + dateStr + ']</span> ';
            html += rest;
            html += '</div>';
        } else if (line.trim()) {
            html += '<div style="margin-bottom:.2rem;font-size:.78rem;line-height:1.5">' + line + '</div>';
        }
    }
    return html;
}

function pollAiBatchStatus() {

// ---------------------------------------------------------------------------
// Peer Comparison (Screener-style)
// ---------------------------------------------------------------------------
var peerState = {
    companyId: null,
    baseSymbol: null,
    symbols: [],          // list of comparison symbols (includes base)
    metrics: null,        // cached metrics catalog
    selectedMetrics: [],  // metric ids to show
    searchResults: []
};

var PEER_STORAGE_KEY = 'peer_compare_';

function getPeerStorage() {
    try {
        var raw = localStorage.getItem(PEER_STORAGE_KEY + peerState.companyId);
        return raw ? JSON.parse(raw) : { symbols: [], metrics: [] };
    } catch (e) {
        return { symbols: [], metrics: [] };
    }
}

function savePeerStorage() {
    try {
        localStorage.setItem(PEER_STORAGE_KEY + peerState.companyId,
            JSON.stringify({ symbols: peerState.symbols, metrics: peerState.selectedMetrics }));
    } catch (e) {}
}

function loadPeerCompare(companyId, symbol) {
    peerState.companyId = companyId;
    peerState.baseSymbol = symbol;

    var stored = getPeerStorage();
    var hasSaved = stored.symbols && stored.symbols.length;

    // Load metrics catalog once
    api('/compare/metrics').then(function(d) {
        peerState.metrics = d.categories || {};
        // Collect all metric ids
        var allIds = [];
        for (var cat in peerState.metrics) {
            for (var i = 0; i < peerState.metrics[cat].length; i++) {
                allIds.push(peerState.metrics[cat][i].id);
            }
        }
        if (stored.metrics && stored.metrics.length) {
            peerState.selectedMetrics = stored.metrics;
        } else {
            // Default selection: common valuation + profitability metrics
            var defaults = ['market_cap_cr', 'pe_ratio', 'pb_ratio', 'roe', 'eps', 'dividend_yield', 'total_announcements', 'sentiment_score'];
            peerState.selectedMetrics = defaults.filter(function(id) { return allIds.indexOf(id) !== -1; });
        }

        if (hasSaved) {
            peerState.symbols = stored.symbols.slice();
            renderPeerCompareUI();
        } else {
            // First visit: auto-populate with same-sector peers (Screener-style)
            api('/compare/sector-peers?company_id=' + companyId + '&limit=5').then(function(sp) {
                var syms = [];
                if (symbol && symbol !== '') syms.push(symbol.toUpperCase());
                var added = {};
                if (symbol) added[symbol.toUpperCase()] = true;
                for (var i = 0; i < (sp.peers || []).length && syms.length < 6; i++) {
                    var ps = sp.peers[i].symbol;
                    if (!added[ps]) {
                        syms.push(ps);
                        added[ps] = true;
                    }
                }
                peerState.symbols = syms;
                savePeerStorage();
                renderPeerCompareUI();
            }).catch(function() {
                // Fallback: just the base company
                peerState.symbols = (symbol && symbol !== '') ? [symbol.toUpperCase()] : [];
                renderPeerCompareUI();
            });
        }
    }).catch(function(e) {
        var el = document.getElementById('peer-compare-content');
        if (el) el.innerHTML = '<div class="muted">Error loading comparison: ' + e.message + '</div>';
    });
}

function renderPeerCompareUI() {
    var card = document.getElementById('peer-compare-card');
    if (!card) return;

    var symbols = peerState.symbols.slice();
    // Ensure base company is first
    if (peerState.baseSymbol && symbols.indexOf(peerState.baseSymbol) === -1) {
        symbols.unshift(peerState.baseSymbol);
    }
    peerState.symbols = symbols;

    var content = document.getElementById('peer-compare-content');
    if (!content) return;

    if (peerState.selectedMetrics.length === 0) {
        content.innerHTML = '<div class="muted">Select metrics below to start comparing.</div>';
        renderMetricPicker();
        renderCompareTable();
        return;
    }

    // Fetch live data for all symbols
    content.innerHTML = '<div style="font-size:.8rem;color:#94a3b8">Fetching live data...</div>';

    var url = '/compare/peers?symbols=' + encodeURIComponent(symbols.join(','));
    api(url).then(function(d) {
        peerState.peerData = d.companies || [];
        renderMetricPicker();
        renderCompareTable();
    }).catch(function(e) {
        content.innerHTML = '<div class="muted">Error: ' + e.message + '</div>';
    });
}

function renderMetricPicker() {
    var card = document.getElementById('peer-compare-card');
    if (!card) return;
    var existing = document.getElementById('peer-metric-picker');
    if (existing) existing.remove();

    if (!peerState.metrics) return;

    var html = '<div id="peer-metric-picker" style="margin-bottom:1rem;padding:.75rem;background:#0f172a;border-radius:8px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;flex-wrap:wrap;gap:.5rem">';
    html += '<div style="font-size:.75rem;color:#94a3b8;font-weight:600">Metrics to compare:</div>';
    html += '<div style="display:flex;gap:.4rem">';
    html += '<button class="btn btn-secondary" style="font-size:.7rem;padding:.2rem .5rem" onclick="selectAllCompareMetrics()">Select All</button>';
    html += '<button class="btn btn-secondary" style="font-size:.7rem;padding:.2rem .5rem" onclick="clearAllCompareMetrics()">Clear</button>';
    html += '</div></div>';

    for (var cat in peerState.metrics) {
        var metrics = peerState.metrics[cat];
        html += '<div style="margin-bottom:.4rem">';
        html += '<div style="font-size:.68rem;color:#60a5fa;font-weight:600;text-transform:uppercase;margin-bottom:.2rem">' + cat + '</div>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:.3rem">';
        for (var i = 0; i < metrics.length; i++) {
            var m = metrics[i];
            var checked = peerState.selectedMetrics.indexOf(m.id) !== -1;
            html += '<label style="display:inline-flex;align-items:center;gap:.25rem;background:#1e293b;border:1px solid #334155;border-radius:6px;padding:.2rem .45rem;font-size:.7rem;cursor:pointer">';
            html += '<input type="checkbox" ' + (checked ? 'checked' : '') + ' onchange="toggleCompareMetric(\'' + m.id + '\', this.checked)" style="cursor:pointer">';
            html += m.label + '</label>';
        }
        html += '</div></div>';
    }
    html += '</div>';

    // Insert picker right after the card header (before content)
    var header = card.querySelector('.peer-head-row');
    if (header && header.nextSibling) {
        card.insertBefore(htmlToDom(html), header.nextSibling);
    } else {
        card.insertBefore(htmlToDom(html), contentElement());
    }
}

function htmlToDom(html) {
    var div = document.createElement('div');
    div.innerHTML = html;
    return div.firstChild;
}

function contentElement() {
    return document.getElementById('peer-compare-content');
}

function toggleCompareMetric(id, checked) {
    var idx = peerState.selectedMetrics.indexOf(id);
    if (checked && idx === -1) peerState.selectedMetrics.push(id);
    if (!checked && idx !== -1) peerState.selectedMetrics.splice(idx, 1);
    savePeerStorage();
    renderCompareTable();
}

function selectAllCompareMetrics() {
    var allIds = [];
    for (var cat in peerState.metrics) {
        for (var i = 0; i < peerState.metrics[cat].length; i++) {
            allIds.push(peerState.metrics[cat][i].id);
        }
    }
    peerState.selectedMetrics = allIds;
    savePeerStorage();
    renderMetricPicker();
    renderCompareTable();
}

function clearAllCompareMetrics() {
    peerState.selectedMetrics = [];
    savePeerStorage();
    renderMetricPicker();
    renderCompareTable();
}

function getMetricDef(id) {
    for (var cat in peerState.metrics) {
        for (var i = 0; i < peerState.metrics[cat].length; i++) {
            if (peerState.metrics[cat][i].id === id) return peerState.metrics[cat][i];
        }
    }
    return null;
}

function formatMetricValue(def, val) {
    if (val === null || val === undefined || val === '') return '-';
    if (def.format === 'money') return '₹' + Number(val).toLocaleString('en-IN', {maximumFractionDigits: 2});
    if (def.format === 'cr') return '₹' + Number(val).toLocaleString('en-IN', {maximumFractionDigits: 0}) + ' Cr';
    if (def.format === 'percent') return Number(val).toFixed(2) + '%';
    if (def.format === 'decimal2') return Number(val).toFixed(2);
    if (def.format === 'decimal0') return Number(val).toFixed(0);
    if (def.format === 'count') return Number(val).toLocaleString('en-IN');
    return val;
}

function metricValueColor(def, val) {
    if (val === null || val === undefined) return '';
    if (def.id === 'sentiment_score' || def.id === 'roe' || def.id === 'roce' ||
        def.id === 'net_margin' || def.id === 'operating_margin' || def.id === 'revenue_growth' || def.id === 'earnings_growth') {
        if (val > 0) return 'color:#34d399';
        if (val < 0) return 'color:#f87171';
    }
    if (def.id === 'debt_to_equity' && val > 1.5) return 'color:#fbbf24';
    return '';
}

function renderCompareTable() {
    var content = document.getElementById('peer-compare-content');
    if (!content) return;

    var symbols = peerState.symbols.slice();
    var data = peerState.peerData || [];
    if (symbols.length === 1) {
        content.innerHTML = '<div class="muted">Add more stocks to compare. Use the search box above.</div>';
        renderStockList();
        return;
    }

    var rows = [];
    for (var i = 0; i < peerState.selectedMetrics.length; i++) {
        rows.push(getMetricDef(peerState.selectedMetrics[i]));
    }
    rows = rows.filter(function(r) { return r; });

    // Build header: Stock column + one column per metric
    var html = '<div style="overflow-x:auto">';
    html += '<table class="compare-table" style="border-collapse:collapse;width:100%;font-size:.78rem">';
    html += '<thead><tr>';
    html += '<th style="text-align:left;padding:.5rem;color:#94a3b8;border-bottom:1px solid #334155;min-width:160px;position:sticky;left:0;background:#1e293b">Stock</th>';
    for (var i = 0; i < rows.length; i++) {
        var def = rows[i];
        html += '<th style="padding:.5rem;text-align:center;border-bottom:1px solid #334155;min-width:110px">';
        html += '<div style="font-weight:600;font-size:.7rem">' + def.label + '</div>';
        html += '<div style="font-size:.58rem;color:#64748b">' + def.desc + '</div>';
        html += '</th>';
    }
    html += '</tr></thead><tbody>';

    for (var c = 0; c < data.length; c++) {
        var d = data[c];
        var sym = d.symbol || symbols[c];
        var isBase = sym === peerState.baseSymbol;
        html += '<tr>';
        html += '<td style="padding:.45rem;border-bottom:1px solid #1e293b;position:sticky;left:0;background:#0f172a">';
        html += '<div style="font-weight:600">' + (d.company_name || sym) + '</div>';
        html += '<div style="font-size:.65rem;color:#94a3b8">' + sym + '</div>';
        if (isBase) html += '<div style="font-size:.6rem;color:#60a5fa;margin-top:.15rem">● This company</div>';
        html += '<span style="cursor:pointer;font-size:.7rem;color:#f87171" title="Remove" onclick="removePeerStock(\'' + sym + '\')">✕</span>';
        html += '</td>';
        for (var r = 0; r < rows.length; r++) {
            var def = rows[r];
            var val = d.metrics ? d.metrics[def.id] : null;
            var color = metricValueColor(def, val);
            html += '<td style="padding:.45rem;text-align:center;border-bottom:1px solid #1e293b;' + color + '">';
            html += formatMetricValue(def, val);
            html += '</td>';
        }
        html += '</tr>';
    }
    html += '</tbody></table></div>';

    content.innerHTML = html;
    renderStockList();
}

function renderStockList() {
    var card = document.getElementById('peer-compare-card');
    if (!card) return;
    var existing = document.getElementById('peer-stock-list');
    if (existing) existing.remove();

    if (peerState.symbols.length < 2) return;

    var html = '<div id="peer-stock-list" style="margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center">';
    html += '<span style="font-size:.7rem;color:#94a3b8">Comparing:</span>';
    for (var i = 0; i < peerState.symbols.length; i++) {
        var sym = peerState.symbols[i];
        var isBase = sym === peerState.baseSymbol;
        html += '<span style="display:inline-flex;align-items:center;gap:.25rem;background:#1e293b;border:1px solid ' + (isBase ? '#60a5fa' : '#334155') + ';border-radius:6px;padding:.2rem .5rem;font-size:.7rem">';
        html += sym;
        if (!isBase) html += '<span style="cursor:pointer;color:#f87171;font-weight:600" onclick="removePeerStock(\'' + sym + '\')">✕</span>';
        html += '</span>';
    }
    html += '</div>';

    var content = document.getElementById('peer-compare-content');
    if (content) content.insertAdjacentHTML('afterend', html);
}

function addPeerStock(symbol) {
    var sym = symbol.toUpperCase().trim();
    if (!sym) return;
    if (peerState.symbols.indexOf(sym) !== -1) {
        document.getElementById('peer-search-results').innerHTML = '<div class="muted" style="font-size:.75rem">' + sym + ' already in comparison.</div>';
        return;
    }
    peerState.symbols.push(sym);
    savePeerStorage();
    document.getElementById('peer-search').value = '';
    document.getElementById('peer-search-results').innerHTML = '';
    renderPeerCompareUI();
}

function removePeerStock(symbol) {
    var idx = peerState.symbols.indexOf(symbol);
    if (idx !== -1) peerState.symbols.splice(idx, 1);
    savePeerStorage();
    renderPeerCompareUI();
}

function addPeerStockByInput() {
    var input = document.getElementById('peer-search');
    var val = input ? input.value : '';
    if (!val.trim()) return;
    addPeerStock(val.trim());
}

// Debounced search for add-stock dropdown
var peerSearchTimer = null;
function peerSearchInput(value) {
    if (peerSearchTimer) clearTimeout(peerSearchTimer);
    peerSearchTimer = setTimeout(function() { doPeerSearch(value); }, 250);
}

function doPeerSearch(value) {
    var resultsEl = document.getElementById('peer-search-results');
    if (!resultsEl) return;
    if (!value || !value.trim()) {
        resultsEl.innerHTML = '';
        return;
    }

    api('/search-stock?q=' + encodeURIComponent(value.trim())).then(function(d) {
        var results = d.results || [];
        if (!results.length) {
            resultsEl.innerHTML = '<div class="muted" style="font-size:.75rem">No matching companies. Try a symbol (e.g. RELIANCE).</div>';
            return;
        }
        var html = '<div style="display:flex;flex-wrap:wrap;gap:.4rem">';
        for (var i = 0; i < results.length; i++) {
            var r = results[i];
            var sym = r.symbol || r.nse_symbol || r.bse_code || '';
            html += '<span style="display:inline-flex;align-items:center;gap:.4rem;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:.3rem .6rem;font-size:.75rem">';
            html += '<div><div style="font-weight:600">' + (r.company_name || sym) + '</div><div class="muted" style="font-size:.65rem">' + sym + '</div></div>';
            html += '<button class="btn btn-secondary" style="font-size:.65rem;padding:.15rem .4rem" onclick="addPeerStock(\'' + sym + '\')">+ Add</button>';
            html += '</span>';
        }
        html += '</div>';
        resultsEl.innerHTML = html;
    }).catch(function(e) {
        resultsEl.innerHTML = '<div class="muted" style="font-size:.75rem">Search error: ' + e.message + '</div>';
    });
}

// ---- Documents section (Screener-style) ----
var docsState = { tab: 'announcements', annFilter: 'recent', annQuery: '', typeFilter: null };

function loadDocuments(companyId) {
    api('/companies/' + companyId + '/documents').then(function(d) {
        docsState.data = d;
        renderDocuments();
    }).catch(function(e) {
        var el = document.getElementById('docs-container');
        if (el) el.innerHTML = '<div class="muted">Error loading documents: ' + e.message + '</div>';
    });
}

            el.innerHTML = '<div class="muted">No corporate events found.</div>';

        }

        var html = '';

        if (enrichment.length) {
            html += '<div style="display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.6rem">';
            for (var e = 0; e < enrichment.length; e++) {
                var en = enrichment[e];
                var ex = (en.exchange || '').toUpperCase();
                var badge = en.status === 'done' ? '#34d399' : (en.status === 'running' ? '#fbbf24' : '#f87171');
                html += '<span style="font-size:.68rem;background:#0f172a;border:1px solid #334155;border-radius:9999px;padding:.15rem .5rem;color:#94a3b8">' +
                        ex + ' <span style="color:' + badge + '">' + (en.status || '') + '</span>' +
                        (en.actions_found ? ' · ' + en.actions_found + ' actions' : '') +
                        (en.board_meetings_found ? ' · ' + en.board_meetings_found + ' bd' : '') +
                        (en.result_calendar_found ? ' · ' + en.result_calendar_found + ' rc' : '') +
                        (en.annual_reports_found ? ' · ' + en.annual_reports_found + ' ar' : '') +
                        '</span>';
            }
            html += '</div>';
        }

        if (ca.length) {
            html += '<div style="font-weight:600;font-size:.8rem;margin:.4rem 0 .4rem">Corporate Actions</div>';
            for (var i = 0; i < ca.length; i++) {
                var a = ca[i];
                var fam = (a.category || '').replace('Corporate Action - ', '').toLowerCase();
                var famColor = fam.indexOf('dividend') >= 0 ? '#34d399' :
                               (fam.indexOf('bonus') >= 0 ? '#a78bfa' :
                               (fam.indexOf('split') >= 0 ? '#60a5fa' : '#fbbf24'));
                html += '<div style="display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-bottom:1px solid #1e293b">';
                html += '<span style="font-size:.65rem;background:' + famColor + '22;color:' + famColor + ';border:1px solid ' + famColor + '55;border-radius:4px;padding:.1rem .35rem;white-space:nowrap">' + fam.toUpperCase() + '</span>';
                html += '<span style="font-size:.75rem;flex:1">' + (a.subcategory || a.headline || '') + '</span>';
                html += '<span style="font-size:.7rem;color:#94a3b8;white-space:nowrap">' + (a.exchange || '') + '</span>';
                html += '<span style="font-size:.7rem;color:#94a3b8;white-space:nowrap">' + (a.date || '') + '</span>';
                html += '</div>';
            }
        }

        if (bm.length) {
            html += '<div style="font-weight:600;font-size:.8rem;margin:.6rem 0 .4rem">Board Meetings</div>';
            for (var j = 0; j < bm.length; j++) {
                var b = bm[j];
                html += '<div style="display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-bottom:1px solid #1e293b">';
                html += '<span style="font-size:.7rem;color:#60a5fa;white-space:nowrap">' + (b.meeting_date || '') + '</span>';
                html += '<span style="font-size:.75rem;flex:1">' + (b.purpose || '') + '</span>';
                html += '<span style="font-size:.7rem;color:#94a3b8;white-space:nowrap">' + (b.exchange || '') + '</span>';
                html += '</div>';
            }
        }

        if (rc.length) {
            html += '<div style="font-weight:600;font-size:.8rem;margin:.6rem 0 .4rem">Result Calendar</div>';
            for (var k = 0; k < rc.length; k++) {
                var r = rc[k];
                html += '<div style="display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-bottom:1px solid #1e293b">';
                html += '<span style="font-size:.7rem;color:#34d399;white-space:nowrap">' + (r.result_date || '') + '</span>';
                html += '<span style="font-size:.75rem;flex:1">' + (r.event || '') + '</span>';
                html += '<span style="font-size:.7rem;color:#94a3b8;white-space:nowrap">' + (r.exchange || '') + '</span>';
                html += '</div>';
            }
        }

        el.innerHTML = html;
    }).catch(function(e) {
        var el = document.getElementById('corporate-events-content');
        if (el) el.innerHTML = '<div class="muted">Error loading corporate events: ' + e.message + '</div>';
    });
}

function renderDocuments() {
    var el = document.getElementById('docs-container');
    if (!el || !docsState.data) return;
    var d = docsState.data;

    var html = '<div style="margin-bottom:.6rem;display:flex;flex-wrap:wrap;gap:.4rem;border-bottom:1px solid #334155;padding-bottom:.5rem">';
    var tabs = [
        { id: 'announcements', label: 'Announcements (' + d.announcements.length + ')' },
        { id: 'corporate_actions', label: 'Corporate Actions (' + (d.corporate_actions || []).length + ')' },
        { id: 'annual_reports', label: 'Annual reports (' + d.annual_reports.length + ')' },
        { id: 'credit_ratings', label: 'Credit ratings (' + d.credit_ratings.length + ')' },
        { id: 'concalls', label: 'Concalls (' + d.concalls.length + ')' },
    ];
    for (var i = 0; i < tabs.length; i++) {
        var t = tabs[i];
        var cls = docsState.tab === t.id ? 'btn btn-primary' : 'btn btn-secondary';
        html += '<button class="' + cls + '" style="font-size:.72rem;padding:.3rem .6rem" onclick="switchDocsTab(\'' + t.id + '\')">' + t.label + '</button>';
    }
    html += '</div>';

    html += renderTypeChips(d);

    if (docsState.tab === 'announcements') html += renderAnnFilterBar(d) + renderAnnList(d.announcements);
    else if (docsState.tab === 'corporate_actions') html += renderCorporateActions(d.corporate_actions || []);
    else if (docsState.tab === 'annual_reports') html += renderAnnualReports(d.annual_reports);
    else if (docsState.tab === 'credit_ratings') html += renderCreditRatings(d.credit_ratings);
    else if (docsState.tab === 'concalls') html += renderConcalls(d.concalls);

    el.innerHTML = html;
}

function renderTypeChips(d) {
    var tc = d.type_counts || {};
    var families = [
        { v: '', l: 'All', n: Object.keys(tc).reduce(function(s, k) { return s + (tc[k] || 0); }, 0) },
        { v: 'corporate_action', l: 'Corporate Action', n: tc.corporate_action || 0 },
        { v: 'financial_result', l: 'Financial Result', n: tc.financial_result || 0 },
        { v: 'board_meeting', l: 'Board Meeting', n: tc.board_meeting || 0 },
        { v: 'credit_rating', l: 'Credit Rating', n: tc.credit_rating || 0 },
        { v: 'general', l: 'General', n: tc.general || 0 },
        { v: 'other', l: 'Other', n: tc.other || 0 },
    ];
    var html = '<div style="margin-bottom:.5rem">';
    html += '<span class="filter-label">Announcement Types</span>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.25rem">';
    for (var i = 0; i < families.length; i++) {
        var f = families[i];
        if (f.v && !f.n) continue;
        var cls = (docsState.typeFilter || '') === f.v ? 'chip active' : 'chip';
        html += '<span class="' + cls + '" onclick="setTypeFilter(\'' + f.v + '\')">' + f.l + ' (' + f.n + ')</span>';
    }
    html += '</div></div>';
    return html;
}

function setTypeFilter(f) {
    docsState.typeFilter = f || null;
    if (docsState.tab !== 'announcements') docsState.tab = 'announcements';
    renderDocuments();
}

function annFamily(a) {
    if (a.event_key && a.event_key.indexOf('ca:') === 0) return 'corporate_action';
    var cat = ((a.category || '') + ' ' + (a.subcategory || '')).toLowerCase();
    if (cat.indexOf('result') !== -1 || cat.indexOf('financial') !== -1) return 'financial_result';
    if (cat.indexOf('board') !== -1) return 'board_meeting';
    if (cat.indexOf('credit') !== -1) return 'credit_rating';
    if (cat.indexOf('general') !== -1) return 'general';
    return 'other';
}

function renderCorporateActions(cas) {
    if (!cas.length) return '<div class="muted">No corporate actions found</div>';
    var famColors = { dividend: '#34d399', bonus: '#a78bfa', split: '#60a5fa', buyback: '#fbbf24', delisting: '#f87171', rights: '#f472b6', 'corporate-action': '#94a3b8' };
    var html = '';
    for (var i = 0; i < cas.length; i++) {
        var ca = cas[i];
        var fam = (ca.family || 'corporate-action').toLowerCase();
        var col = famColors[fam] || '#94a3b8';
        html += '<div class="ann-item" style="display:flex;align-items:center;gap:.6rem">';
        html += '<span style="font-size:.62rem;background:' + col + '22;color:' + col + ';border:1px solid ' + col + '55;border-radius:4px;padding:.15rem .4rem;white-space:nowrap;text-transform:uppercase">' + fam + '</span>';
        html += '<div style="flex:1;min-width:0">';
        html += '<div style="font-weight:500;font-size:.8rem">' + (ca.subcategory || ca.headline || 'Corporate Action') + '</div>';
        if (ca.ai_summary && ca.ai_summary.summary) html += '<div style="font-size:.7rem;color:#c4b5fd;margin-top:.15rem;line-height:1.5">' + ca.ai_summary.summary + '</div>';
        html += '</div>';
        html += '<span class="muted" style="font-size:.65rem;white-space:nowrap">' + (ca.exchange || '') + ' · ' + (ca.date || '') + '</span>';
        html += '</div>';
    }
    return html;
}

function switchDocsTab(tab) {
    docsState.tab = tab;
    renderDocuments();
    if (tab === 'concalls') pollConcallBatchStatus();
}

function renderAnnFilterBar(d) {
    var filters = [
        { id: 'recent', label: 'Recent' },
        { id: 'important', label: 'Important' },
        { id: 'search', label: 'Search' },
        { id: 'all', label: 'All' },
    ];
    var html = '<div style="display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.5rem">';
    for (var i = 0; i < filters.length; i++) {
        var f = filters[i];
        var cls = docsState.annFilter === f.id ? 'btn btn-primary' : 'btn btn-secondary';
        html += '<button class="' + cls + '" style="font-size:.68rem;padding:.2rem .5rem" onclick="setAnnFilter(\'' + f.id + '\')">' + f.label + '</button>';
    }
    if (docsState.annFilter === 'search') {
        html += '<input type="text" id="ann-search" placeholder="Search announcements..." style="font-size:.72rem;padding:.3rem .5rem;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0" oninput="setAnnQuery(this.value)">';
    }
    html += '</div>';
    return html;
}

function setAnnFilter(f) {
    docsState.annFilter = f;
    docsState.annQuery = '';
    renderDocuments();
}

function setAnnQuery(q) {
    docsState.annQuery = q;
    renderDocuments();
}

function renderAnnList(anns) {
    var list = anns.slice();
    if (docsState.typeFilter) {
        var tf = docsState.typeFilter;
        list = list.filter(function(a) { return annFamily(a) === tf; });
    }
    if (docsState.annFilter === 'important') {
        list = list.filter(function(a) {
            if (a.importance) return a.importance === 'high';
            var t = ((a.headline || '') + ' ' + (a.category || '')).toLowerCase();
            return t.indexOf('result') !== -1 || t.indexOf('credit rating') !== -1 || t.indexOf('board meeting') !== -1;
        });
    } else if (docsState.annFilter === 'recent') {
        list = list.slice(0, 20);
    } else if (docsState.annFilter === 'search') {
        var q = (docsState.annQuery || '').toLowerCase();
        list = list.filter(function(a) {
            return !q || (a.headline || '').toLowerCase().indexOf(q) !== -1 ||
                   (a.category || '').toLowerCase().indexOf(q) !== -1 ||
                   (a.description || '').toLowerCase().indexOf(q) !== -1;
        });
    }
    if (!list.length) return '<div class="muted">No announcements found</div>';

    var html = '';
    for (var i = 0; i < list.length; i++) {
        html += renderDocAnnouncement(list[i]);
    }
    return html;
}

function renderDocAnnouncement(a) {
    var html = '<div class="ann-item">';
    html += '<div style="display:flex;justify-content:space-between;align-items:start;gap:.5rem">';
    html += '<div style="font-weight:500;font-size:.8rem">' + (a.headline || 'No title') + '</div>';
    html += '<span class="muted" style="font-size:.62rem;white-space:nowrap">' + (a.date || '') + '</span>';
    html += '</div>';
    html += '<div style="display:flex;gap:.4rem;align-items:center;margin-top:.15rem;flex-wrap:wrap">';
    html += '<span class="muted" style="font-size:.65rem">' + (a.exchange || '') + ' | ' + (a.category || '') + '</span>';
    if (a.ai_summary) {
        var imp = a.ai_summary.importance || 'medium';
        var impColor = imp === 'high' ? '#fbbf24' : imp === 'low' ? '#64748b' : '#94a3b8';
        var sent = a.ai_summary.sentiment || 'neutral';
        var sentColor = sent === 'positive' ? '#34d399' : sent === 'negative' ? '#f87171' : '#60a5fa';
        html += '<span style="font-size:.62rem;color:' + impColor + '">[' + imp.toUpperCase() + ']</span>';
        html += '<span style="font-size:.62rem;color:' + sentColor + '">' + sent.toUpperCase() + '</span>';
    }
    if (a.attachment_url) {
        html += '<a href="' + a.attachment_url + '" target="_blank" rel="noopener" class="btn btn-secondary" style="font-size:.62rem;padding:.1rem .4rem;text-decoration:none">Attachment ↗</a>';
    }
    html += '</div>';
    if (a.ai_summary && a.ai_summary.summary) {
        html += '<div style="font-size:.7rem;color:#c4b5fd;margin-top:.25rem;line-height:1.5">' + a.ai_summary.summary + '</div>';
    } else if (a.description) {
        html += '<div style="font-size:.7rem;color:#64748b;margin-top:.15rem">' + a.description.substring(0, 180) + (a.description.length > 180 ? '...' : '') + '</div>';
    }
    html += '</div>';
    return html;
}

function renderAnnualReports(ars) {
    if (!ars.length) return '<div class="muted">No annual reports found</div>';
    var html = '';
    for (var i = 0; i < ars.length; i++) {
        var ar = ars[i];
        html += '<div class="ann-item" style="display:flex;justify-content:space-between;align-items:center;gap:.5rem">';
        html += '<div>';
        html += '<div style="font-weight:500;font-size:.8rem">' + (ar.fy || 'Annual Report') + '</div>';
        html += '<div class="muted" style="font-size:.65rem">from ' + ar.source + (ar.size ? ' · ' + ar.size : '') + '</div>';
        html += '</div>';
        if (ar.file_name) {
            html += '<a href="' + ar.file_name + '" target="_blank" rel="noopener" class="btn btn-secondary" style="font-size:.65rem;padding:.2rem .5rem;text-decoration:none">View PDF ↗</a>';
        }
        html += '</div>';
    }
    return html;
}

function renderCreditRatings(crs) {
    if (!crs.length) return '<div class="muted">No credit ratings found</div>';
    var html = '';
    for (var i = 0; i < crs.length; i++) {
        var cr = crs[i];
        html += '<div class="ann-item" style="display:flex;justify-content:space-between;align-items:center;gap:.5rem">';
        html += '<div>';
        html += '<div style="font-weight:500;font-size:.8rem">Rating update</div>';
        html += '<div class="muted" style="font-size:.65rem">' + (cr.date || '') + ' from ' + (cr.agency || 'nse/bse') + '</div>';
        if (cr.ai_summary && cr.ai_summary.summary) {
            html += '<div style="font-size:.7rem;color:#c4b5fd;margin-top:.2rem">' + cr.ai_summary.summary + '</div>';
        }
        html += '</div>';
        if (cr.attachment_url) {
            html += '<a href="' + cr.attachment_url + '" target="_blank" rel="noopener" class="btn btn-secondary" style="font-size:.65rem;padding:.2rem .5rem;text-decoration:none">View ↗</a>';
        }
        html += '</div>';
    }
    return html;
}

function renderConcalls(concalls) {
    if (!concalls.length) return '<div class="muted">No concalls found</div>';
    var html = '';

    html += '<div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem;padding-bottom:.5rem;border-bottom:1px solid #334155">';
    html += '<button class="btn btn-secondary" id="cc-batch-btn" onclick="startConcallBatch(' + state.companyId + ')">Analyze Concalls</button>';
    html += '<button class="btn btn-secondary" id="cc-batch-stop-btn" onclick="stopConcallBatch()" style="display:none">Stop</button>';
    html += '<div id="cc-batch-progress" style="font-size:.7rem;color:#94a3b8">No concall analysis running.</div>';
    html += '</div>';

    var totalAnalyzed = 0;
    for (var i = 0; i < concalls.length; i++) {
        var cc = concalls[i];
        totalAnalyzed += (cc.analyzed || 0);
    }
    if (totalAnalyzed > 0) {
        html += '<div style="font-size:.68rem;color:#34d399;margin-bottom:.5rem">' + totalAnalyzed + ' concalls summarized with AI</div>';
    }

    for (var i = 0; i < concalls.length; i++) {
        var cc = concalls[i];
        html += '<div class="ann-item">';
        html += '<div style="display:flex;justify-content:space-between;align-items:center">';
        html += '<div style="font-weight:600;font-size:.8rem">' + cc.quarter + '</div>';
        html += '<span class="muted" style="font-size:.65rem">' + (cc.analyzed || 0) + '/' + cc.total + ' summarized</span>';
        html += '</div>';
        var assets = [
            { key: 'transcript', label: 'Transcript', color: '#60a5fa' },
            { key: 'ppt', label: 'PPT', color: '#34d399' },
            { key: 'record', label: 'REC', color: '#fbbf24' },
            { key: 'other', label: 'Other', color: '#94a3b8' },
        ];
        var shown = false;
        html += '<div style="display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.3rem">';
        for (var j = 0; j < assets.length; j++) {
            var as = assets[j];
            var items = cc[as.key];
            if (!items || !items.length) continue;
            shown = true;
            for (var k = 0; k < items.length; k++) {
                var it = items[k];
                var ccInfo = it.concall || {};
                var title = (ccInfo.status === 'done' && ccInfo.summary)
                    ? ccInfo.summary.substring(0, 70) : (it.ai_summary && it.ai_summary.summary
                        ? it.ai_summary.summary.substring(0, 70) : (it.headline || as.label));
                html += '<span style="display:inline-flex;align-items:center;gap:.3rem;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:.2rem .45rem;font-size:.65rem">';
                html += '<span style="color:' + as.color + ';font-weight:600">' + as.label + '</span>';
                if (ccInfo.status === 'done') html += '<span style="color:#34d399" title="Analyzed">&#10003;</span>';
                html += '<span class="muted">' + title + '</span>';
                if (it.attachment_url) {
                    html += '<a href="' + it.attachment_url + '" target="_blank" rel="noopener" style="color:#60a5fa;text-decoration:none">\u2197</a>';
                }
                html += '</span>';
                if (ccInfo.status === 'done' && (ccInfo.summary || ccInfo.guidance || ccInfo.management_views || ccInfo.qna_summary)) {
                    html += renderConcallSummary(it);
                }
            }
        }
        if (!shown) html += '<span class="muted" style="font-size:.65rem">No assets</span>';
        html += '</div></div>';
    }
    return html;
}

function renderConcallSummary(it) {
    var cc = it.concall || {};
    var html = '<details style="margin:.35rem 0 .6rem;background:#0f172a;border:1px solid #1e293b;border-radius:6px;padding:.4rem .6rem">';
    html += '<summary style="cursor:pointer;font-size:.7rem;font-weight:600;color:#a78bfa">AI Summary'
        + (cc.sentiment ? ' &mdash; <span style="color:' + (cc.sentiment === 'positive' ? '#34d399' : cc.sentiment === 'negative' ? '#f87171' : '#60a5fa') + '">' + cc.sentiment.toUpperCase() + '</span>' : '')
        + '</summary>';
    html += '<div style="font-size:.7rem;color:#cbd5e1;line-height:1.55;margin-top:.35rem">';
    if (cc.summary) html += '<div>' + cc.summary + '</div>';
    if (cc.guidance) html += '<div style="margin-top:.4rem"><span style="color:#f59e0b;font-weight:600">Guidance: </span>' + cc.guidance + '</div>';
    if (cc.management_views) html += '<div style="margin-top:.4rem"><span style="color:#34d399;font-weight:600">Management views: </span>' + cc.management_views + '</div>';
    if (cc.qna_summary) html += '<div style="margin-top:.4rem"><span style="color:#60a5fa;font-weight:600">Q&amp;A: </span>' + cc.qna_summary + '</div>';
    if (cc.key_topics && cc.key_topics.length) {
        html += '<div style="margin-top:.4rem;display:flex;gap:.3rem;flex-wrap:wrap">';
        for (var i = 0; i < cc.key_topics.length; i++) {
            html += '<span class="sector-badge" style="font-size:.6rem">' + cc.key_topics[i] + '</span>';
        }
        html += '</div>';
    }
    html += '</div></details>';
    return html;
}

renderNav();
render();
</script>

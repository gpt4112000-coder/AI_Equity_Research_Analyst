<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Equity Research - Small Cap India</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0}
        .card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:1.25rem;margin-bottom:.75rem}
        .grad{background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .btn{padding:.4rem .8rem;border-radius:8px;cursor:pointer;border:none;font-weight:500;font-size:.8rem}
        .btn-p{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}
        .btn-s{background:#334155;color:#e2e8f0}
        .btn-a{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}
        .chip{display:inline-block;padding:.35rem .75rem;border-radius:9999px;margin:.15rem;cursor:pointer;background:#1e293b;border:1px solid #334155;color:#94a3b8;font-size:.75rem}
        .chip:hover{border-color:#60a5fa;color:#fff}
        .chip.a{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;border-color:transparent}
        input,select{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:.4rem .75rem;color:#e2e8f0;font-size:.8rem}
        input:focus,select:focus{outline:none;border-color:#3b82f6}
        table{width:100%;border-collapse:collapse}
        th,td{padding:.5rem;text-align:left;border-bottom:1px solid #334155;font-size:.8rem}
        th{color:#94a3b8;font-weight:500}
        tr:hover{background:#1e293b}
        .fade{animation:fadeIn .3s ease-in}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .g2{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}
        .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
        .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem}
        @media(max-width:768px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
        .tag{display:inline-block;padding:.15rem .5rem;border-radius:4px;font-size:.65rem;font-weight:600}
        .tag-pos{background:#064e3b;color:#34d399}
        .tag-neg{background:#7f1d1d;color:#fca5a5}
        .tag-neu{background:#1e3a5f;color:#60a5fa}
    </style>
</head>
<body>
<div id="app">
    <nav style="border-bottom:1px solid #334155;padding:.75rem 1.25rem">
        <div style="max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between">
            <div style="font-size:1.1rem;font-weight:700" class="grad">AI Equity Research - Small Cap India</div>
            <div id="nav"></div>
        </div>
    </nav>
    <main style="max-width:1400px;margin:0 auto;padding:1.25rem" id="content"></main>
</div>

<script>
const API=window.location.protocol+'//'+window.location.hostname+':8001/api';
let S={page:'dashboard',sector:null,companyId:null,filters:{}};

async function api(e){const r=await fetch(`${API}${e}`);if(!r.ok)throw new Error(r.status);return r.json()}

function nav(){
    const p=['dashboard','companies'];
    document.getElementById('nav').innerHTML=p.map(x=>
        `<button class="btn ${S.page===x?'btn-a':'btn-s'}" onclick="go('${x}')" style="margin-left:.5rem">${x[0].toUpperCase()+x.slice(1)}</button>`
    ).join('');
}

function go(page,o={}){S={...S,...o};nav();render()}

function render(){
    const el=document.getElementById('content');
    if(S.page==='dashboard')rDash(el);
    else if(S.page==='companies')rCompanies(el);
    else if(S.page==='company')rCompany(el);
}

function fmt(n){return n?(n).toFixed(0)+' Cr':'-'}
function fmtShort(n){if(!n)return'-';if(n>=1e7)return(n/1e7).toFixed(1)+' Cr';if(n>=1e5)return(n/1e5).toFixed(1)+' L';return n.toFixed(0)}

async function rDash(el){
    el.innerHTML='<div style="text-align:center;padding:4rem;color:#64748b">Loading...</div>';
    try{
        const d=await api('/stats');
        el.innerHTML=`<div class="fade">
            <div class="g4" style="margin-bottom:1rem">
                <div class="card"><div style="color:#94a3b8;font-size:.75rem">Companies</div><div style="font-size:1.75rem;font-weight:700" class="grad">${d.total_companies}</div></div>
                <div class="card"><div style="color:#94a3b8;font-size:.75rem">Announcements</div><div style="font-size:1.75rem;font-weight:700" class="grad">${d.total_announcements.toLocaleString()}</div></div>
                <div class="card"><div style="color:#94a3b8;font-size:.75rem">Insights</div><div style="font-size:1.75rem;font-weight:700" class="grad">${d.total_insights.toLocaleString()}</div></div>
                <div class="card"><div style="color:#94a3b8;font-size:.75rem">Active Companies</div><div style="font-size:1.75rem;font-weight:700" class="grad">${d.companies_with_announcements}</div></div>
            </div>
            <div class="g2">
                <div class="card">
                    <h3 style="font-size:.9rem;font-weight:600;margin-bottom:.75rem">By Exchange</h3>
                    ${Object.entries(d.by_exchange||{}).map(([k,v])=>`
                        <div style="display:flex;align-items:center;margin-bottom:.4rem">
                            <span style="width:60px;font-size:.75rem;text-transform:uppercase">${k}</span>
                            <div style="flex:1;margin:0 .5rem;background:#334155;border-radius:9999px;height:5px">
                                <div style="background:#8b5cf6;height:5px;border-radius:9999px;width:${(v/d.total_announcements)*100}%"></div>
                            </div>
                            <span style="font-size:.7rem;color:#94a3b8">${v.toLocaleString()}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="card">
                    <h3 style="font-size:.9rem;font-weight:600;margin-bottom:.75rem">Insight Types</h3>
                    ${Object.entries(d.by_insight_type||{}).filter(([k])=>k!=='general').map(([k,v])=>`
                        <div style="display:flex;align-items:center;margin-bottom:.4rem;cursor:pointer" onclick="go('companies',{insightFilter:'${k}'})">
                            <span style="width:100px;font-size:.7rem;text-transform:capitalize">${k.replace(/_/g,' ')}</span>
                            <div style="flex:1;margin:0 .5rem;background:#334155;border-radius:9999px;height:5px">
                                <div style="background:#8b5cf6;height:5px;border-radius:9999px;width:${(v/d.total_insights)*100}%"></div>
                            </div>
                            <span style="font-size:.7rem;color:#94a3b8">${v.toLocaleString()}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
            <div style="margin-top:1rem;text-align:center">
                <button class="btn btn-p" onclick="go('companies')" style="padding:.6rem 1.5rem;font-size:.9rem">Browse Companies</button>
            </div>
        </div>`;
    }catch(e){el.innerHTML=`<div class="card">Error: ${e.message}</div>`}
}

async function rCompanies(el){
    el.innerHTML='<div style="text-align:center;padding:4rem;color:#64748b">Loading...</div>';
    try{
        const[sectors]=await Promise.all([api('/sectors')]);
        const params=new URLSearchParams();
        if(S.sector)params.set('sector',S.sector);
        if(S.search)params.set('search',S.search);
        if(S.insightFilter){
            const map={guidance:'has_guidance',capex:'has_capex',order:'has_orders',dividend:'has_dividend',financial:'has_financials'};
            if(map[S.insightFilter])params.set(map[S.insightFilter],'1');
        }
        params.set('limit','100');
        if(S.offset)params.set('offset',String(S.offset));
        const d=await api(`/companies?${params}`);

        el.innerHTML=`<div class="fade">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem">
                <div>
                    <input type="text" placeholder="Search company or symbol..." value="${S.search||''}"
                        onkeyup="if(event.key==='Enter'){S.search=this.value;S.offset=0;rCompanies(document.getElementById('content'))}"
                        style="width:280px">
                    <button class="btn btn-s" onclick="S.search=document.querySelector('input').value;S.offset=0;rCompanies(document.getElementById('content'))" style="margin-left:.25rem">Search</button>
                </div>
                <div style="color:#94a3b8;font-size:.8rem">${d.total.toLocaleString()} companies</div>
            </div>
            <div style="margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:.25rem">
                <span class="chip ${!S.sector?'a':''}" onclick="S.sector=null;S.offset=0;rCompanies(document.getElementById('content'))">All</span>
                ${Object.entries(sectors.sectors||{}).map(([k,v])=>
                    `<span class="chip ${S.sector===k?'a':''}" onclick="S.sector='${k}';S.offset=0;rCompanies(document.getElementById('content'))">${k.replace(/_/g,' ')} (${v})</span>`
                ).join('')}
            </div>
            <div style="overflow-x:auto">
                <table>
                    <thead>
                        <tr>
                            <th onclick="sort('company')" style="cursor:pointer">Company</th>
                            <th onclick="sort('market_cap')" style="cursor:pointer">MCap</th>
                            <th>Sector</th>
                            <th>Exch</th>
                            <th onclick="sort('announcements')" style="cursor:pointer">Anns</th>
                            <th>Insights</th>
                            <th>Latest</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${d.companies.map(c=>`<tr onclick="go('company',{companyId:${c.id}})" style="cursor:pointer">
                            <td>
                                <div style="font-weight:600;font-size:.85rem">${c.company_name}</div>
                                <div style="font-size:.7rem;color:#94a3b8">${c.nse_symbol||c.bse_code||''}</div>
                            </td>
                            <td style="font-size:.75rem">₹${fmt(c.market_cap_cr)}</td>
                            <td><span style="font-size:.65rem;padding:.15rem .4rem;border-radius:4px;background:#1e3a5f;color:#60a5fa">${(c.sector||'other').replace(/_/g,' ')}</span></td>
                            <td style="font-size:.7rem">${c.nse_symbol?'NSE':''}${c.nse_symbol&&c.bse_code?'/':''}${c.bse_code?'BSE':''}</td>
                            <td style="font-size:.75rem">${c.total_announcements}</td>
                            <td style="font-size:.7rem">
                                ${c.has_guidance?'<span class="tag tag-guide">G</span>':''}
                                ${c.has_orders?'<span class="tag" style="background:#78350f;color:#fbbf24">O</span>':''}
                                ${c.has_capex?'<span class="tag" style="background:#164e63;color:#67e8f9">C</span>':''}
                                ${c.has_dividend?'<span class="tag" style="background:#713f12;color:#fde68a">D</span>':''}
                                ${c.has_financials?'<span class="tag" style="background:#065f46;color:#6ee7b7">F</span>':''}
                            </td>
                            <td style="font-size:.7rem;color:#94a3b8">${c.latest_announcement||'-'}</td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>
            ${d.total>100?`<div style="display:flex;justify-content:center;gap:.5rem;margin-top:1rem">
                <button class="btn btn-s" onclick="S.offset=Math.max(0,(S.offset||0)-100);rCompanies(document.getElementById('content'))" ${!S.offset?'disabled':''}>Prev</button>
                <span style="color:#94a3b8;font-size:.8rem;line-height:2">Page ${Math.floor((S.offset||0)/100)+1} of ${Math.ceil(d.total/100)}</span>
                <button class="btn btn-s" onclick="S.offset=(S.offset||0)+100;rCompanies(document.getElementById('content'))" ${(S.offset||0)+100>=d.total?'disabled':''}>Next</button>
            </div>`:''}
        </div>`;
    }catch(e){el.innerHTML=`<div class="card">Error: ${e.message}</div>`}
}

function sort(col){
    if(S.sortBy===col)S.sortOrder=S.sortOrder==='desc'?'asc':'desc';
    else{S.sortBy=col;S.sortOrder='desc'}
    rCompanies(document.getElementById('content'));
}

async function rCompany(el){
    el.innerHTML='<div style="text-align:center;padding:4rem;color:#64748b">Loading...</div>';
    try{
        const d=await api(`/companies/${S.companyId}`);
        const c=d.company;
        const anns=d.announcements;
        const ins=d.insight_summary;

        el.innerHTML=`<div class="fade">
            <button class="btn btn-s" onclick="go('companies')" style="margin-bottom:1rem">Back to List</button>
            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:1rem">
                    <div>
                        <h2 style="font-size:1.25rem;font-weight:700">${c.company_name}</h2>
                        <div style="color:#94a3b8;font-size:.8rem;margin-top:.25rem">
                            ${c.nse_symbol?`NSE: ${c.nse_symbol}`:''}
                            ${c.nse_symbol&&c.bse_code?' | ':''}
                            ${c.bse_code?`BSE: ${c.bse_code}`:''}
                            ${c.group_name?` | Group: ${c.group_name}`:''}
                        </div>
                    </div>
                    <div style="text-align:right">
                        <div style="font-size:1.5rem;font-weight:700" class="grad">₹${fmt(c.market_cap_cr)}</div>
                        <div style="font-size:.75rem;color:#94a3b8">${c.sector||''} | ${c.industry||''}</div>
                    </div>
                </div>
            </div>
            <div class="g4" style="margin-bottom:1rem">
                <div class="card"><div style="color:#94a3b8;font-size:.7rem">Announcements</div><div style="font-size:1.25rem;font-weight:700">${c.total_announcements}</div></div>
                <div class="card"><div style="color:#94a3b8;font-size:.7rem">Guidance</div><div style="font-size:1.25rem;font-weight:700">${c.has_guidance?'Yes':'No'}</div></div>
                <div class="card"><div style="color:#94a3b8;font-size:.7rem">Orders</div><div style="font-size:1.25rem;font-weight:700">${c.has_orders?'Yes':'No'}</div></div>
                <div class="card"><div style="color:#94a3b8;font-size:.7rem">Capex</div><div style="font-size:1.25rem;font-weight:700">${c.has_capex?'Yes':'No'}</div></div>
            </div>
            ${(c.guidance_text||c.order_text||c.capex_text||c.dividend_text||c.financial_text)?`<div class="card">
                <h3 style="font-size:.9rem;font-weight:600;margin-bottom:.5rem">Key Insights</h3>
                ${c.guidance_text?`<div style="margin-bottom:.4rem"><span class="tag tag-guide">Guidance</span> <span style="font-size:.75rem">${c.guidance_text}</span></div>`:''}
                ${c.order_text?`<div style="margin-bottom:.4rem"><span class="tag" style="background:#78350f;color:#fbbf24">Orders</span> <span style="font-size:.75rem">${c.order_text}</span></div>`:''}
                ${c.capex_text?`<div style="margin-bottom:.4rem"><span class="tag" style="background:#164e63;color:#67e8f9">Capex</span> <span style="font-size:.75rem">${c.capex_text}</span></div>`:''}
                ${c.dividend_text?`<div style="margin-bottom:.4rem"><span class="tag" style="background:#713f12;color:#fde68a">Dividend</span> <span style="font-size:.75rem">${c.dividend_text}</span></div>`:''}
                ${c.financial_text?`<div style="margin-bottom:.4rem"><span class="tag" style="background:#065f46;color:#6ee7b7">Financial</span> <span style="font-size:.75rem">${c.financial_text}</span></div>`:''}
            </div>`:''}
            ${ins.length?`<div class="card">
                <h3 style="font-size:.9rem;font-weight:600;margin-bottom:.5rem">Insight Breakdown</h3>
                <div style="display:flex;flex-wrap:wrap;gap:.5rem">
                    ${ins.map(i=>`<div style="background:#0f172a;border-radius:8px;padding:.5rem .75rem">
                        <div style="font-size:.7rem;color:#94a3b8;text-transform:capitalize">${i.insight_type.replace(/_/g,' ')}</div>
                        <div style="font-size:1rem;font-weight:600">${i.cnt}</div>
                    </div>`).join('')}
                </div>
            </div>`:''}
            <div class="card">
                <h3 style="font-size:.9rem;font-weight:600;margin-bottom:.5rem">Recent Announcements</h3>
                ${anns.length?anns.map(a=>`<div style="padding:.5rem 0;border-bottom:1px solid #334155">
                    <div style="display:flex;justify-content:space-between;align-items:start">
                        <div style="font-size:.8rem;font-weight:500">${a.headline||'No title'}</div>
                        <span style="font-size:.65rem;color:#94a3b8;white-space:nowrap;margin-left:.5rem">${a.announcement_date||''}</span>
                    </div>
                    <div style="font-size:.7rem;color:#94a3b8;margin-top:.2rem">${a.exchange} | ${a.category||''}</div>
                    ${a.description?`<div style="font-size:.7rem;color:#64748b;margin-top:.2rem">${a.description.substring(0,200)}${a.description.length>200?'...':''}</div>`:''}
                </div>`).join(''):'<div style="color:#64748b;font-size:.8rem">No announcements</div>'}
            </div>
        </div>`;
    }catch(e){el.innerHTML=`<div class="card">Error: ${e.message}</div>`}
}

nav();render();
</script>
</body>
</html>

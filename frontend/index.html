<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Equity Research - Small Cap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .gradient-text { background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn { padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; border: none; font-weight: 500; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; }
        .btn-secondary { background: #334155; color: #e2e8f0; }
        .btn-sm { padding: 0.25rem 0.75rem; font-size: 0.875rem; }
        .btn-active { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; }
        .sector-chip { display: inline-block; padding: 0.5rem 1rem; border-radius: 9999px; margin: 0.25rem; cursor: pointer; background: #1e293b; border: 1px solid #334155; color: #94a3b8; font-size: 0.875rem; }
        .sector-chip:hover { border-color: #60a5fa; color: white; }
        .sector-chip.active { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; border-color: transparent; }
        input, select { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 0.5rem 1rem; color: #e2e8f0; font-size: 0.875rem; }
        input:focus, select:focus { outline: none; border-color: #3b82f6; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
        @media (max-width: 768px) { .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); } }
        .loading { text-align: center; padding: 4rem; color: #64748b; }
        .empty { text-align: center; padding: 4rem; color: #64748b; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #334155; font-size: 0.875rem; }
        th { color: #94a3b8; font-weight: 500; }
        tr:hover { background: #1e293b; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: #1e293b; border-radius: 12px; padding: 2rem; max-width: 800px; max-height: 80vh; overflow-y: auto; width: 90%; }
    </style>
</head>
<body>
    <div id="app">
        <nav style="border-bottom: 1px solid #334155; padding: 1rem 1.5rem;">
            <div style="max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;">
                <div style="font-size: 1.25rem; font-weight: 700;" class="gradient-text">AI Equity Research</div>
                <div id="nav-buttons"></div>
            </div>
        </nav>
        <main style="max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem;" id="content"></main>
    </div>
    <div id="modal"></div>

    <script>
    const API = 'http://localhost:8001/api';
    let state = { page: 'dashboard', sector: null, companyId: null, filters: {} };

    async function api(endpoint) {
        const res = await fetch(`${API}${endpoint}`);
        if (!res.ok) throw new Error(`API error: ${res.status}`);
        return res.json();
    }

    function nav() {
        const pages = ['dashboard', 'companies', 'announcements'];
        document.getElementById('nav-buttons').innerHTML = pages.map(p =>
            `<button class="btn ${state.page === p ? 'btn-active' : 'btn-secondary'}" onclick="go('${p}')" style="margin-left: 0.5rem;">${p.charAt(0).toUpperCase() + p.slice(1)}</button>`
        ).join('');
    }

    function go(page, opts = {}) {
        state = { ...state, page, ...opts };
        nav();
        render();
    }

    function render() {
        const el = document.getElementById('content');
        if (state.page === 'dashboard') renderDashboard(el);
        else if (state.page === 'companies') renderCompanies(el);
        else if (state.page === 'announcements') renderAnnouncements(el);
        else if (state.page === 'company') renderCompany(el);
    }

    async function renderDashboard(el) {
        el.innerHTML = '<div class="loading">Loading...</div>';
        try {
            const d = await api('/dashboard');
            el.innerHTML = `
                <div class="fade-in">
                    <div class="grid-4" style="margin-bottom: 2rem;">
                        <div class="card"><div style="color: #94a3b8; font-size: 0.875rem;">Companies</div><div style="font-size: 2rem; font-weight: 700;" class="gradient-text">${d.total_companies}</div></div>
                        <div class="card"><div style="color: #94a3b8; font-size: 0.875rem;">Announcements</div><div style="font-size: 2rem; font-weight: 700;" class="gradient-text">${d.total_announcements}</div></div>
                        <div class="card"><div style="color: #94a3b8; font-size: 0.875rem;">Avg MCap</div><div style="font-size: 2rem; font-weight: 700;" class="gradient-text">₹${d.averages?.avg_mcap || 0} Cr</div></div>
                        <div class="card"><div style="color: #94a3b8; font-size: 0.875rem;">Avg ROE</div><div style="font-size: 2rem; font-weight: 700;" class="gradient-text">${d.averages?.avg_roe || 0}%</div></div>
                    </div>
                    <div class="grid-2">
                        <div class="card">
                            <h3 style="font-size: 1rem; font-weight: 600; margin-bottom: 1rem;">Sectors</h3>
                            ${Object.entries(d.sector_distribution).map(([s, c]) => `
                                <div style="display: flex; align-items: center; margin-bottom: 0.5rem; cursor: pointer;" onclick="go('companies', {sector: '${s}'})">
                                    <span style="width: 120px; font-size: 0.8rem; text-transform: capitalize;">${s.replace('_', ' ')}</span>
                                    <div style="flex: 1; margin: 0 0.5rem; background: #334155; border-radius: 9999px; height: 6px;">
                                        <div style="background: #3b82f6; height: 6px; border-radius: 9999px; width: ${(c / d.total_companies) * 100}%;"></div>
                                    </div>
                                    <span style="font-size: 0.8rem; color: #94a3b8;">${c}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="card">
                            <h3 style="font-size: 1rem; font-weight: 600; margin-bottom: 1rem;">Top Announcements</h3>
                            ${Object.entries(d.top_categories).slice(0, 10).map(([cat, c]) => `
                                <div style="display: flex; align-items: center; margin-bottom: 0.5rem;">
                                    <span style="width: 180px; font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${cat}</span>
                                    <div style="flex: 1; margin: 0 0.5rem; background: #334155; border-radius: 9999px; height: 6px;">
                                        <div style="background: #8b5cf6; height: 6px; border-radius: 9999px; width: ${(c / d.total_announcements) * 100}%;"></div>
                                    </div>
                                    <span style="font-size: 0.8rem; color: #94a3b8;">${c}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        } catch (e) { el.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
    }

    async function renderCompanies(el) {
        el.innerHTML = '<div class="loading">Loading...</div>';
        try {
            const [sectorsData, companiesData] = await Promise.all([
                api('/sectors'),
                api(`/companies?sector=${state.sector || ''}&limit=100`)
            ]);

            el.innerHTML = `
                <div class="fade-in">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h2 style="font-size: 1.5rem; font-weight: 700;">Companies (${companiesData.total})</h2>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="search" placeholder="Search..." style="width: 200px;" onkeyup="filterCompanies()">
                            <select id="sortBy" onchange="filterCompanies()">
                                <option value="market_cap">Market Cap</option>
                                <option value="pe_ratio">P/E Ratio</option>
                                <option value="roe">ROE</option>
                                <option value="company_name">Name</option>
                            </select>
                        </div>
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <span class="sector-chip ${!state.sector ? 'active' : ''}" onclick="go('companies', {sector: null})">All</span>
                        ${Object.keys(sectorsData.sectors).map(s => `
                            <span class="sector-chip ${state.sector === s ? 'active' : ''}" onclick="go('companies', {sector: '${s}'})">${s.replace('_', ' ')}</span>
                        `).join('')}
                    </div>
                    <div class="card" style="overflow-x: auto;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Company</th>
                                    <th>Sector</th>
                                    <th>MCap (Cr)</th>
                                    <th>P/E</th>
                                    <th>P/B</th>
                                    <th>ROE</th>
                                    <th>Price</th>
                                    <th>Trend</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${companiesData.companies.map(c => `
                                    <tr>
                                        <td>
                                            <div style="font-weight: 600;">${c.nse_symbol || '-'}</div>
                                            <div style="font-size: 0.75rem; color: #64748b;">${(c.company_name || '').substring(0, 30)}</div>
                                        </td>
                                        <td style="text-transform: capitalize; font-size: 0.8rem;">${(c.sector || '').replace('_', ' ')}</td>
                                        <td>${c.market_cap ? '₹' + (c.market_cap / 1e7).toFixed(0) : '-'}</td>
                                        <td>${c.pe_ratio ? c.pe_ratio.toFixed(1) : '-'}</td>
                                        <td>${c.pb_ratio ? c.pb_ratio.toFixed(1) : '-'}</td>
                                        <td>${c.roe ? (c.roe * 100).toFixed(1) + '%' : '-'}</td>
                                        <td>${c.current_price ? '₹' + c.current_price.toFixed(2) : '-'}</td>
                                        <td style="font-size: 0.8rem;">${c.sma_50 && c.current_price ? (c.current_price > c.sma_50 ? '📈' : '📉') : '-'}</td>
                                        <td><button class="btn btn-primary btn-sm" onclick="viewCompany(${c.id})">View</button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        } catch (e) { el.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
    }

    async function filterCompanies() {
        const search = document.getElementById('search')?.value || '';
        const sortBy = document.getElementById('sortBy')?.value || 'market_cap';
        const el = document.getElementById('content');
        try {
            const data = await api(`/companies?sector=${state.sector || ''}&search=${search}&sort_by=${sortBy}&limit=100`);
            const tbody = el.querySelector('tbody');
            if (tbody) {
                tbody.innerHTML = data.companies.map(c => `
                    <tr>
                        <td>
                            <div style="font-weight: 600;">${c.nse_symbol || '-'}</div>
                            <div style="font-size: 0.75rem; color: #64748b;">${(c.company_name || '').substring(0, 30)}</div>
                        </td>
                        <td style="text-transform: capitalize; font-size: 0.8rem;">${(c.sector || '').replace('_', ' ')}</td>
                        <td>${c.market_cap ? '₹' + (c.market_cap / 1e7).toFixed(0) : '-'}</td>
                        <td>${c.pe_ratio ? c.pe_ratio.toFixed(1) : '-'}</td>
                        <td>${c.pb_ratio ? c.pb_ratio.toFixed(1) : '-'}</td>
                        <td>${c.roe ? (c.roe * 100).toFixed(1) + '%' : '-'}</td>
                        <td>${c.current_price ? '₹' + c.current_price.toFixed(2) : '-'}</td>
                        <td style="font-size: 0.8rem;">${c.sma_50 && c.current_price ? (c.current_price > c.sma_50 ? '📈' : '📉') : '-'}</td>
                        <td><button class="btn btn-primary btn-sm" onclick="viewCompany(${c.id})">View</button></td>
                    </tr>
                `).join('');
            }
        } catch (e) {}
    }

    async function viewCompany(id) {
        state.companyId = id;
        go('company');
    }

    async function renderCompany(el) {
        if (!state.companyId) { el.innerHTML = '<div class="empty">Select a company</div>'; return; }
        el.innerHTML = '<div class="loading">Loading...</div>';
        try {
            const [profile, techs] = await Promise.all([
                api(`/companies/${state.companyId}`),
                api(`/companies/${state.companyId}/technicals`).catch(() => null)
            ]);
            const c = profile.company;
            const s = profile.summary;
            const t = techs?.indicators;

            el.innerHTML = `
                <div class="fade-in">
                    <button class="btn btn-secondary btn-sm" onclick="go('companies')" style="margin-bottom: 1rem;">← Back</button>
                    <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;" class="gradient-text">${c.company_name}</h2>
                    <div style="color: #94a3b8; font-size: 0.875rem; margin-bottom: 1.5rem;">
                        NSE: ${c.nse_symbol || 'N/A'} | Sector: ${(c.sector || '').replace('_', ' ')} | MCap: ${c.market_cap ? '₹' + (c.market_cap / 1e7).toFixed(0) + ' Cr' : 'N/A'}
                    </div>
                    <div class="grid-4" style="margin-bottom: 1.5rem;">
                        <div class="card"><div style="color: #94a3b8; font-size: 0.75rem;">Price</div><div style="font-size: 1.25rem; font-weight: 600;">₹${c.current_price?.toFixed(2) || 'N/A'}</div></div>
                        <div class="card"><div style="color: #94a3b8; font-size: 0.75rem;">P/E</div><div style="font-size: 1.25rem; font-weight: 600;">${c.pe_ratio?.toFixed(1) || 'N/A'}</div></div>
                        <div class="card"><div style="color: #94a3b8; font-size: 0.75rem;">ROE</div><div style="font-size: 1.25rem; font-weight: 600;">${c.roe ? (c.roe * 100).toFixed(1) + '%' : 'N/A'}</div></div>
                        <div class="card"><div style="color: #94a3b8; font-size: 0.75rem;">RSI</div><div style="font-size: 1.25rem; font-weight: 600;">${t?.rsi_14?.toFixed(1) || 'N/A'}</div></div>
                    </div>
                    <div class="grid-3">
                        <div class="card">
                            <h3 style="font-size: 1rem; font-weight: 600; margin-bottom: 1rem;">Technical</h3>
                            <div style="font-size: 0.875rem; line-height: 2;">
                                <div><span style="color: #94a3b8;">Trend:</span> ${t?.trend || 'N/A'}</div>
                                <div><span style="color: #94a3b8;">Signal:</span> ${t?.signal || 'N/A'}</div>
                                <div><span style="color: #94a3b8;">SMA 50:</span> ₹${t?.sma_50?.toFixed(2) || 'N/A'}</div>
                                <div><span style="color: #94a3b8;">SMA 200:</span> ₹${t?.sma_200?.toFixed(2) || 'N/A'}</div>
                                <div><span style="color: #94a3b8;">MACD:</span> ${t?.macd?.toFixed(2) || 'N/A'}</div>
                            </div>
                        </div>
                        <div class="card">
                            <h3 style="font-size: 1rem; font-weight: 600; margin-bottom: 1rem;">Fundamentals</h3>
                            <div style="font-size: 0.875rem; line-height: 2;">
                                <div><span style="color: #94a3b8;">P/B:</span> ${c.pb_ratio?.toFixed(2) || 'N/A'}</div>
                                <div><span style="color: #94a3b8;">EPS:</span> ₹${c.eps?.toFixed(2) || 'N/A'}</div>
                                <div><span style="color: #94a3b8;">D/E:</span> ${c.debt_to_equity?.toFixed(2) || 'N/A'}</div>
                                <div><span style="color: #94a3b8;">Beta:</span> ${c.beta?.toFixed(2) || 'N/A'}</div>
                                <div><span style="color: #94a3b8;">52W High:</span> ₹${c.week_52_high?.toFixed(2) || 'N/A'}</div>
                            </div>
                        </div>
                        <div class="card">
                            <h3 style="font-size: 1rem; font-weight: 600; margin-bottom: 1rem;">Summary</h3>
                            <div style="font-size: 0.875rem; line-height: 2;">
                                <div><span style="color: #94a3b8;">Announcements:</span> ${s.total_announcements}</div>
                                <div><span style="color: #94a3b8;">Themes:</span> ${s.key_themes.join(', ') || 'None'}</div>
                            </div>
                        </div>
                    </div>
                    ${profile.key_announcements.length > 0 ? `
                    <div class="card" style="margin-top: 1rem;">
                        <h3 style="font-size: 1rem; font-weight: 600; margin-bottom: 1rem;">Recent Announcements</h3>
                        ${profile.key_announcements.slice(0, 8).map(a => `
                            <div style="border-left: 3px solid #3b82f6; padding-left: 1rem; margin-bottom: 0.5rem;">
                                <div style="font-size: 0.875rem;">${a.headline || a.category}</div>
                                <div style="font-size: 0.75rem; color: #64748b;">${a.category} | ${a.announcement_date}</div>
                            </div>
                        `).join('')}
                    </div>` : ''}
                </div>
            `;
        } catch (e) { el.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
    }

    async function renderAnnouncements(el) {
        el.innerHTML = '<div class="loading">Loading dates...</div>';
        try {
            const { dates } = await api('/cache/dates');
            const recent = dates.slice(-14);
            el.innerHTML = `
                <div class="fade-in">
                    <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem;">Announcements</h2>
                    <div style="margin-bottom: 1rem; display: flex; gap: 1rem;">
                        <select id="annDate" onchange="loadAnn()" style="width: 200px;">
                            ${recent.map(d => `<option value="${d}">${d}</option>`).join('')}
                        </select>
                        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem;">
                            <input type="checkbox" id="annImportant" onchange="loadAnn()"> Important only
                        </label>
                    </div>
                    <div id="annContent"></div>
                </div>
            `;
            loadAnn();
        } catch (e) { el.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
    }

    async function loadAnn() {
        const date = document.getElementById('annDate')?.value;
        const important = document.getElementById('annImportant')?.checked;
        if (!date) return;
        const el = document.getElementById('annContent');
        el.innerHTML = '<div class="loading">Loading...</div>';
        try {
            const data = await api(`/cache/${date}/announcements?important_only=${important}`);
            const comps = Object.entries(data.by_company);
            el.innerHTML = `
                <div class="grid-4" style="margin-bottom: 1rem;">
                    <div class="card"><div style="color: #94a3b8; font-size: 0.75rem;">Total</div><div style="font-size: 1.5rem; font-weight: 700;" class="gradient-text">${data.total}</div></div>
                    <div class="card"><div style="color: #94a3b8; font-size: 0.75rem;">Companies</div><div style="font-size: 1.5rem; font-weight: 700;" class="gradient-text">${comps.length}</div></div>
                    <div class="card"><div style="color: #94a3b8; font-size: 0.75rem;">BSE</div><div style="font-size: 1.5rem; font-weight: 700; color: #60a5fa;">${data.stats.by_exchange?.BSE || 0}</div></div>
                    <div class="card"><div style="color: #94a3b8; font-size: 0.75rem;">NSE</div><div style="font-size: 1.5rem; font-weight: 700; color: #34d399;">${data.stats.by_exchange?.NSE || 0}</div></div>
                </div>
                ${comps.slice(0, 30).map(([k, comp]) => `
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span style="font-weight: 600;">${comp.company_name || k}</span>
                            <span style="font-size: 0.75rem; color: #64748b;">${comp.announcements.length} items</span>
                        </div>
                        ${comp.announcements.slice(0, 3).map(a => `
                            <div style="font-size: 0.875rem; color: #cbd5e1; display: flex; gap: 0.5rem; margin-top: 0.25rem;">
                                <span style="font-size: 0.7rem; padding: 0.125rem 0.5rem; border-radius: 4px; background: ${a.exchange === 'BSE' ? '#1e3a5f' : '#1a3a2a'}; color: ${a.exchange === 'BSE' ? '#60a5fa' : '#34d399'};">${a.exchange}</span>
                                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${a.headline || a.category}</span>
                            </div>
                        `).join('')}
                    </div>
                `).join('')}
            `;
        } catch (e) { el.innerHTML = `<div class="empty">Error loading announcements</div>`; }
    }

    nav();
    render();
    </script>
</body>
</html>

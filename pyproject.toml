[project]
name = "ai-equity-research"
version = "0.1.0"
description = "AI-powered equity research platform for Indian small cap/micro cap stocks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI Equity Research Team"}
]
keywords = ["equity", "research", "india", "smallcap", "microcap", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "yfinance>=0.2.40",
    "pandas>=2.2.3",
    "requests>=2.32.3",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/gpt4112000-coder/AI_Equity_Research_Analyst"
Repository = "https://github.com/gpt4112000-coder/AI_Equity_Research_Analyst"
Issues = "https://github.com/gpt4112000-coder/AI_Equity_Research_Analyst/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["backend*"]
